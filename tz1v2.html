  {t:"Sabzavotlar",title:"The Vegetable Garden",text:"Mr. Karimov has a small garden behind his house. He grows many vegetables. In spring he plants potatoes, carrots and onions. In summer there are tomatoes, cucumbers and peppers in the garden. His wife uses them to make a fresh salad every day. Their son Jasur does not like cabbage, but he loves potatoes. Mr. Karimov says, \"Vegetables are good for your body.\" Every Sunday he gives some carrots to his neighbor. The neighbor says thank you and smiles.",q:[

  {t:"Hayvonlar",title:"Animals on the Farm",text:"Dilnoza lives near a farm. There are many animals on the farm. There are five cows, ten sheep and twenty chickens. A horse lives there too. It is big and brown. Dilnoza has a small white rabbit and a dog named Rex. Rex is very friendly and he can run fast. Dilnoza's cat sleeps all day. In the evening, birds sing in the trees. Dilnoza loves animals. On Sundays, she visits the farm and gives food to the chickens. She wants to be a vet in the future.",q:[

  {t:"Mebel va uy-ro'zg'or buyumlari",title:"Furniture at Home",text:"This is my living room. It is not very big, but it is nice. There is a brown sofa near the window. In front of the sofa there is a small table. On the table there is a lamp and a clock. There are two armchairs and a TV too. On the floor there is a soft carpet.\n\nMy bedroom has a bed, a wardrobe and a desk. The desk is next to the window. There is a chair at the desk. My books are on a shelf above the desk. In the kitchen there is a fridge, a stove and a table with four chairs. My mother says, \"Everything has its place.\" I agree.",q:[

  {t:"Kiyimlar",title:"What to Wear",text:"Today is a cold day in January. Aziz gets up at seven o'clock and goes to his wardrobe. He puts on a warm sweater, blue jeans and thick socks. Then he puts on his black boots. Outside it is snowing, so he takes his coat, a hat and gloves too.\n\nHis sister Malika wears a school uniform: a white blouse, a grey skirt and black shoes. In summer she likes to wear a light dress and sandals. Her brother prefers shorts and a T-shirt in hot weather. On Sunday the family goes to a wedding. Father wears a dark suit and a tie. Mother wears a long red dress. Malika wants a new scarf, but she has only an old one.",q:[

  {t:"Tana a'zolari",title:"The Human Body",text:"The human body has many parts. We have a head, two arms and two legs. On the head there are two eyes, two ears, a nose and a mouth. We see with our eyes and hear with our ears. We smell with our nose and eat with our mouth.\n\nOur hands have five fingers each. We write and hold things with our hands. We walk and run with our feet and legs. Our back and neck help us stand and sit. Inside the body there is a heart. It is small, but it works all day and night. Our brain is in our head, and we think with it. Dr. Rashid says, \"Wash your hands, brush your teeth and exercise every day. Then your body stays healthy.\"",q:[

  {t:"Maktab",title:"A Day at School",text:"Zarina is a student at School Number 5. Every morning she goes to school with her friend Lola. Lessons start at eight o'clock. Zarina has five lessons a day: English, maths, science, music and art. Her English teacher is Mrs. Brown. She is kind and funny.\n\nIn the classroom there are twenty desks, a blackboard and a big clock. Zarina has a bag with her books, notebooks, a pen, a pencil and a ruler. At ten o'clock there is a break. The students go to the playground and play games. Lunch is at twelve. Zarina likes music lessons the most because she can sing. After school she does her homework and reads a book. She wants to be a good student.",q:[

  {t:"Transport",title:"How We Travel",text:"My name is Tom and I live in a big city. Every day I go to work by bus. The bus stop is near my house. I wait for the bus for ten minutes. The bus is often full, but I like it because it is cheap. A ticket costs one dollar.\n\nMy wife Sara goes to work by train. The train station is far from our home, so she takes a taxi to the station. She says the train is fast and comfortable. Our son Ben goes to school by bike. He wears a helmet because it is safe.\n\nAt the weekend we sometimes travel by car. My father has an old blue car. Last Sunday we drove to the lake. We also like planes, but we do not fly often. Planes are expensive. Next summer we will take a plane to Spain.",q:[

  {t:"Shahar joylari",title:"My City",text:"Welcome to my city. It is not very big, but it is nice. In the centre there is a large park with a fountain. Near the park you can find a library, a museum and a cinema. I often go to the library after school because I like reading books.\n\nOpposite the library there is a bank and a post office. My mother works in the hospital, which is behind the bank. There is also a big supermarket on Green Street. The bakery next to it sells fresh bread every morning.\n\nMy school is not far from my house. I walk there in ten minutes. On Saturdays my friends and I go to the cinema or visit the zoo. In the evening we sometimes eat in a small café near the bridge. It is my favourite place in the city.",q:[

  {t:"Xarid",title:"A Day of Shopping",text:"Last Saturday I went shopping with my sister Lola. First we went to the market to buy fruit and vegetables. We bought apples and tomatoes. The apples were cheap, only 8,000 sum a kilo. The seller was a friendly old man and he gave us a free melon.\n\nThen we visited a big shopping centre. Lola wanted to buy a new dress for her birthday. She tried on a red dress, but it was too small. She tried on a blue one, and it fitted well. The price was 200,000 sum.\n\nI needed new shoes. Then I saw a sale. Shoes were half price! I bought black shoes for 150,000 sum.\n\nAfter shopping we were tired and hungry. We took a taxi home. I love shopping, but I cannot buy everything. Next week I will look for a warm jacket.",q:[

  {t:"Ob-havo",title:"What Is the Weather Like?",text:"The weather in my country is very different from place to place. Today it is sunny and warm in my city. The sky is blue and there are no clouds. But yesterday the weather was bad. It was cloudy and windy, and in the evening it rained a lot. I stayed at home and drank hot tea.\n\nMy cousin lives in the north. There it is very cold in winter. It snows every week and the temperature is minus twenty degrees. In the south it is hot in summer, sometimes forty degrees. People drink cold water and stay in the shade.\n\nTomorrow it will be foggy in the morning, and then it will be warm again. On Friday there will be a storm with thunder and lightning. I do not like storms, so I will not go out. I always check the weather forecast on my phone before I leave the house.",q:[

  {t:"Fasllar va oylar",title:"Four Seasons",text:"There are four seasons in a year: spring, summer, autumn and winter. Each season has three months. Spring starts in March. March, April and May are warm and green. Flowers open, and birds come back. My birthday is in April, so I love this month.\n\nSummer is from June to August. It is hot and sunny. School is closed, and my family goes to the river every weekend. We swim, eat watermelon and play games. July is the hottest month.\n\nAutumn begins in September. The days become shorter and the leaves turn yellow and red. In October we pick apples and grapes in our garden. November is rainy and grey, and I do not like it very much. School starts again in September, so autumn is also a busy time.\n\nWinter comes in December. December, January and February are cold. Sometimes there is snow, and children make a snowman. On the first of January we celebrate the New Year with a big dinner. My favourite season is summer because I can be outside all day. What is your favourite season?",q:[

  {t:"Hafta kunlari va vaqt",title:"My Busy Week",text:"My week is always busy. On Monday I get up at six o'clock and go to work. I start work at eight and finish at five. On Tuesday and Thursday I go to an English class in the evening. The class begins at half past six and ends at eight. On Wednesday I meet my friend Aziz for lunch at one o'clock. We usually eat at the same café.\n\nOn Friday I finish work early, at three o'clock. I go to the gym for an hour and then I go home. Friday evening is family time. We cook dinner together and watch a film.\n\nSaturday is my favourite day because I can sleep until nine. In the morning I clean the house, and in the afternoon I visit my grandmother. She lives far away, so I leave at quarter past two and arrive at four. On Sunday we rest. We go to the park at about eleven in the morning and come back at five in the afternoon.\n\nThere are seven days in a week, and I think the weekend is too short! I always say that time goes fast when you are happy.",q:[

  {t:"Kundalik tartib",title:"My Daily Routine",text:"My name is Dilnoza and I am a student. I have a simple daily routine. I wake up at six thirty every morning. First I brush my teeth and wash my face. Then I get dressed and have breakfast with my family. I usually eat bread and eggs and drink tea.\n\nAt seven thirty I leave the house and take the bus to university. My lessons start at eight thirty. I study until two o'clock, and then I have lunch with my classmates. In the afternoon I go to the library and do my homework for two hours.\n\nI come home at five o'clock. I help my mother cook dinner and we eat together at seven. After dinner I wash the dishes, and then I watch TV or read a book. Sometimes I call my friend on the phone. I take a shower at ten o'clock and go to bed at half past ten.\n\nOn weekends my routine is different. I get up late, clean my room and go shopping. Today is Sunday, and I am sitting in the garden with a cup of tea. I am happy because I do not have lessons.",q:[

  {t:"Sifatlar",title:"My Family and My Town",text:"Let me tell you about my family and my town. My grandfather is old but very strong. He is tall, with white hair and kind eyes. He is also funny, and he tells us interesting stories. My grandmother is short and thin. She is quiet and gentle, and she cooks delicious food.\n\nMy brother Bobur is young, only seven years old. He is noisy and lazy, but he is very clever. He can already read big books. My sister Madina is beautiful and friendly. She has long black hair. Everybody loves her because she is helpful and polite.\n\nOur town is small but very clean. The streets are wide and quiet. Our house is old, but it is comfortable and warm. The garden is large and full of colourful flowers. In the centre of the town there is a famous market. It is always busy and loud, and the fruit is fresh and cheap.\n\nI think my family is wonderful and my town is lovely. I am lucky and happy to live here.",q:[

  {t:"Sport va hobbilar",title:"Our Hobbies",text:"Everybody needs a hobby. I love sport, and I play football every Saturday with my friends. We play in the park near my house. Our team is not very good, but we have a lot of fun. Last week we won 3-2, and I scored one goal.\n\nMy brother does not like football. He prefers swimming. He goes to the swimming pool three times a week and he can swim very fast. He wants to be a champion one day. My sister plays tennis. She practises on Tuesdays and Thursdays with a coach. She also does yoga in the morning.\n\nMy father likes quiet hobbies. He plays chess and goes fishing at the weekend. He says fishing is relaxing. My mother likes painting and gardening. She paints pictures of flowers and our house. Some of them are on the walls in our living room.\n\nIn winter we do different things. We go skiing in the mountains and play table tennis at home. I also like reading and listening to music. I play the guitar a little, and I am learning a new song now. What are your hobbies? I think a hobby makes life more interesting and keeps us healthy.",q:[

  {t:"Sayohat",title:"A Trip to Turkey",text:"Last summer I travelled to Turkey with my friend Kamola. We planned the trip for two months. First we booked our plane tickets and a hotel on the internet. The tickets were not expensive. We packed our suitcases carefully. I took summer clothes, a camera and a map. Kamola almost forgot her passport, but she found it in time.\n\nWe went to the airport by taxi and checked in. The flight to Istanbul took four hours. When we arrived, a driver took us to our hotel. It was small but clean, and the staff were very friendly. Our room had a beautiful view of the sea.\n\nDuring the week we visited many famous places. We saw the Blue Mosque and walked through the big old market. We bought some gifts for our families there: scarves, sweets and a small lamp. One day we took a boat trip on the sea. It was wonderful. We also tried local food, and my favourite dish was kebab with rice.\n\nOn the last day it rained, so we stayed in the hotel and packed our bags. We were sad to leave, but we took hundreds of photos. Next year we want to visit Italy. I love travelling because I can meet new people and learn about other cultures.",q:[

  {t:"Salomatlik va shifokor",title:"At the Doctor",text:"Yesterday I did not feel well. I woke up with a headache and a sore throat. I also had a high temperature and a cough. My mother touched my forehead and said that I was ill. She called the clinic and made an appointment with the doctor for ten o'clock.\n\nThe doctor was a kind young woman. She asked me many questions. How long do you have a cough? Where does it hurt? I told her about my headache and sore throat. She looked into my throat and listened to my chest. She also measured my temperature. It was thirty-eight and a half degrees.\n\nThe doctor said I had a cold and a little fever, but nothing serious. She wrote a prescription for me. I had to take tablets after meals, three times a day, and drink a syrup for the cough. She also told me to stay in bed for three days, drink a lot of warm tea with lemon and eat fruit and vegetables. She said I must not go to school until Monday.\n\nAfter the clinic we went to the pharmacy and bought the medicine. At home I slept for a long time. Today I feel much better, and my temperature is normal. Health is very important. To stay healthy, I will sleep eight hours, do exercise and wash my hands often.",q:[

  {t:"Tabiat",title:"A Day in the Mountains",text:"Nature is all around us. Last weekend my class went on a trip to the mountains. We left school early in the morning by bus. The road was long, but the view from the window was beautiful. We saw green fields, small rivers and high hills.\n\nWhen we arrived, our teacher showed us a big forest. The trees were tall and old. We walked along a path for two hours. We heard birds singing and saw a squirrel on a tree. A deer ran across the path and disappeared among the trees. We were very quiet because we did not want to frighten the animals.\n\nThen we found a clear stream and a small waterfall. The water was cold and fresh. We sat on the rocks and had lunch. After lunch some students collected leaves and flowers, and others took photos of butterflies. In the afternoon we climbed to the top of the mountain. It was hard work, but the view was amazing. We could see the whole valley, the lake and the sun above the clouds.\n\nBefore we left, our teacher asked us to take all our rubbish with us. She said we must protect nature: do not cut trees, do not make fires and do not throw plastic on the ground. It was the best day of the year, and I want to go there again in spring.",q:[

  {t:"Restoran",title:"Dinner at a Restaurant",text:"Last Friday was my parents' wedding anniversary, so we went to a restaurant. It is called The Garden and it is in the city centre. My father booked a table for five people the day before. When we arrived, a waiter welcomed us and took us to a table near the window.\n\nThe waiter gave us the menu. There were many dishes, and it was difficult to choose. My father ordered grilled meat with salad. My mother wanted fish, but the waiter said there was no fish that day, so she asked for chicken soup and rice. My sister is a vegetarian, and she chose a vegetable pizza. I was very hungry, so I ordered a big burger with chips. My little brother wanted pasta with cheese. For drinks, we asked for water, orange juice and green tea.\n\nThe food came after twenty minutes. It was hot and delicious. The soup was a little salty, but everybody enjoyed the meal. For dessert we shared a big chocolate cake and ice cream. My father asked for the bill, and he paid by card. He also left a tip for the waiter because the service was excellent.\n\nWe stayed there for two hours and talked a lot. My parents were very happy. On the way home my mother said that it was a perfect evening. I want to eat at that restaurant again.",q:[

  {t:"Texnologiya",title:"Technology in My Life",text:"Technology is a big part of our lives. I use many devices every day. The most important one is my smartphone. I use it to call my family, send messages, take photos and check the news. I also use apps to learn English and listen to music. My phone battery is weak, so I charge it every night.\n\nAt home we have a laptop, a tablet and a smart TV. My father works on the laptop. He writes emails and joins online meetings. My mother likes the tablet. She watches cooking videos and finds new recipes on the internet. My little brother plays games on the tablet, but we do not let him play for more than one hour. Too much screen time is bad for the eyes.\n\nAt school we have computers in the classroom. The teacher shows us lessons on a big screen, and we search for information online. Last month I made a short video for my project. I recorded it with my phone and edited it on a computer. My classmates liked it a lot.\n\nTechnology is useful, but it has problems too. Sometimes the internet is slow, or the computer does not work. Also, people often look at their phones instead of talking to each other. Last week my grandfather bought his first phone. I taught him how to take a selfie. He laughed and was very proud. I think we should use technology, but we must remember to spend time with real people, too.",q:[

  {t:"His-tuyg'ular",title:"A Day of Feelings",text:"Everybody has feelings, and they change every day. Yesterday was a day with many emotions for me. In the morning I was happy because it was my birthday. My family gave me a big cake and a new bicycle. I smiled all morning, and I felt very lucky.\n\nAt school I was a little nervous. We had an important English test, and I was afraid of making mistakes. My hands were cold and my heart was beating fast. Then I opened the paper and saw that the questions were easy. I felt calm and relaxed. After the test my teacher said I did very well, and I felt proud.\n\nIn the afternoon my best friend Jasur came to my party. He looked sad. I asked him what was wrong. He told me his dog was ill and he was worried. I felt sorry for him. I hugged him and said the dog would be fine. Later Jasur called the vet, and the news was good. He was very surprised and happy. Then we both laughed.\n\nIn the evening I was tired but still excited. My cousin was angry at first because someone broke his toy, but he soon forgot about it. When the guests went home, I felt a little lonely, but I also felt grateful. I think it is normal to feel different emotions. Talking to friends and family helps us feel better when we are sad or angry.",q:[

function daily(){
  const rd=rawDay(),st=toNum(S.start);
  let cells="";
  for(let i=0;i<30;i++){
    const n=i+1;
    if(n>rd)cells+=`<div class="cell fut">${n}</div>`;
    else{const s=S.sec[dstr(st+i)]||0;cells+=`<div class="cell ${n===rd?"now":""}"><small>${n}</small>${icon(s)}</div>`}
  }
  const t=S.sec[today()]||0;
  go("daily",`<button class="back" id="bk">← Orqaga</button><h2>Kun tartibi</h2>
  <div class="meta" style="margin-bottom:10px">Bugun: ${Math.floor(t/60)} daqiqa ${t%60} soniya</div>
  <div class="grid5">${cells}</div>
  <div class="legend"><div>🔥 30 daqiqa yoki undan ko'p ishlatdingiz</div><div>❤️‍🔥 Kirdingiz, lekin 30 daqiqadan kam</div><div>🧊 Kirmadingiz</div></div>`);
  $("bk").onclick=menu;
}

const KIND={v:{name:"Lug'at",data:()=>WORDS,tn:20},g:{name:"Grammatika",data:()=>GR,tn:15},t:{name:"Matnlar",data:()=>TX,tn:10}};
function list(kind){
  const K=KIND[kind],D=K.data(),dn=dayNo();
  const tile=(n,a)=>{
    const lock=n>dn,r=S.res[kind+n];
    const top=a==="l"?`${n}-kun`:(r?`✓ ${r.s}/${r.t}`:`${n}-test`);
    return `<button class="tile ${lock?"lock":""} ${a==="q"&&r?"done":""}" data-n="${n}" data-a="${a}"><b>${lock?"🔒 ":""}${top}</b><span>${esc(D[n-1].t)}</span></button>`;
  };
  let a="",b="";
  for(let n=1;n<=30;n++){a+=tile(n,"l");b+=tile(n,"q")}
  go("list-"+kind,`<button class="back" id="bk">← Orqaga</button><h2>${K.name}</h2>
  <div class="meta">Har kuni bitta yangi mavzu ochiladi.</div>
  <div class="sec">${kind==="v"?"LUG'AT":kind==="g"?"DARSLAR":"MATNLAR"} (30)</div><div class="grid2">${a}</div>
  <div class="sec">TESTLAR (30 ta · ${K.tn} savoldan)</div><div class="grid2">${b}</div>`);
  $("bk").onclick=menu;
  app.querySelectorAll(".tile").forEach(el=>el.onclick=()=>{
    const n=+el.dataset.n;
    if(n>dn){toast(`Bu mavzu ${n}-kuni ochiladi 🔒`);return}
    el.dataset.a==="l"?learn(kind,n):startTest(kind,n);
  });
}

function learn(kind,n){
  const back=()=>list(kind),d=KIND[kind].data()[n-1];
  let h=`<button class="back" id="bk">← Orqaga</button><h2>${n}. ${esc(d.t)}</h2>`;
  if(kind==="v"){
    h+=`<div class="words">${d.w.map((w,i)=>`<div class="wr"><span class="n">${i+1}</span><span class="e">${esc(w[0])}</span><span class="u">${esc(w[1])}</span><button class="spk" data-s="${i}" aria-label="Tinglash">🔊</button></div>`).join("")}</div>`;
  }else if(kind==="g"){
    h+=`<div class="box">${d.rule.split("\n").map(x=>`<p>${esc(x)}</p>`).join("")}</div>
    <div class="sec">MISOLLAR</div><div class="box">${d.ex.map(e=>`<div class="ex"><b>${esc(e[0])}</b><span>${esc(e[1])}</span></div>`).join("")}</div>`;
  }else{
    h+=`<div class="meta">${esc(d.title)}</div><div class="box" style="margin-top:8px">${d.text.split(/\n+/).map(x=>`<p>${esc(x)}</p>`).join("")}</div>
    <button class="big alt" id="lis">🔊 Tinglash</button>`;
  }
  h+=`<button class="big" id="ts">✏️ Testni boshlash</button>`;
  go("learn",h);
  $("bk").onclick=back;$("ts").onclick=()=>startTest(kind,n);
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>speak(d.w[+b.dataset.s][0]));
  if($("lis"))$("lis").onclick=()=>speak(d.text);
}

/* Test savollarini tayyorlash */
function shufOpts(q){
  const c=q.o[q.a],o=shuffle(q.o);
  return Object.assign({},q,{o,a:o.indexOf(c)});
}
function mkVocab(n){
  const w=WORDS[n-1].w;
  const qs=w.map((p,i)=>{
    const toUz=i%2===0,side=toUz?1:0;
    const wrong=shuffle(w.filter((x,j)=>j!==i)).slice(0,3).map(x=>x[side]);
    const o=shuffle([p[side],...wrong]);
    return {q:p[toUz?0:1],h:toUz?"O'zbekchasini tanlang":"Inglizchasini tanlang",say:toUz?p[0]:null,o,a:o.indexOf(p[side])};
  });
  return shuffle(qs);
}
function startTest(kind,n){
  const D=KIND[kind].data()[n-1],title=`${n}. ${D.t}`;
  const mk=kind==="v"?()=>mkVocab(n):kind==="g"?()=>shuffle(D.q).map(shufOpts):()=>D.q.map(q=>q.o?shufOpts(q):q);
  quiz(mk,kind+n,()=>list(kind),title);
}
const norm=s=>String(s).toLowerCase().replace(/'/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim().replace(/^(the|a|an) /,"");

function quiz(mk,key,back,title){
  const qs=mk();let i=0,score=0;
  const draw=()=>{
    if(i>=qs.length){
      const prev=S.res[key];if(!prev||score>prev.s)S.res[key]={s:score,t:qs.length};
      S.sec[today()]=S.sec[today()]||1;save();
      const p=score/qs.length;
      go("res",`<div class="center"><h2>${esc(title)}</h2><div class="score">${score}/${qs.length}</div>
      <p>${p>=.8?"Ajoyib! 🎉":p>=.5?"Yaxshi, davom eting! 💪":"Yana mashq qiling, albatta chiqadi! 🌱"}</p>
      <button class="big" id="ag">Qayta topshirish</button><button class="big alt" id="bk">Orqaga</button></div>`);
      $("ag").onclick=()=>quiz(mk,key,back,title);$("bk").onclick=back;return;
    }
    const q=qs[i];
    let h=`<button class="back" id="bk">← Orqaga</button><div class="meta">${esc(title)} · ${i+1}/${qs.length}</div>
    <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
    ${q.h?`<div class="meta center" style="margin-top:14px">${esc(q.h)}</div>`:(q.open?`<div class="meta center" style="margin-top:14px">Javobni yozing</div>`:"")}
    <div class="q">${esc(q.q)}</div>${q.say?`<div class="center"><button class="spk" id="sp" aria-label="Tinglash">🔊</button></div>`:""}`;
    if(q.o)h+=q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("");
    else h+=`<input class="in" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Javobingiz..."><div id="fb"></div><button class="big" id="ck">Tekshirish</button>`;
    go("quiz",h);
    $("bk").onclick=back;
    if(q.say)$("sp").onclick=()=>speak(q.say);
    let done=false;
    if(q.o){
      app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        if(done)return;done=true;
        const ok=+b.dataset.k===q.a;
        if(ok){score++;b.classList.add("ok")}
        else{b.classList.add("no");app.querySelectorAll(".opt")[q.a].classList.add("ok")}
        setTimeout(()=>{i++;draw()},ok?700:1500);
      });
    }else{
      const inp=$("in"),ck=$("ck");
      const check=()=>{
        if(done){i++;draw();return}
        const v=inp.value;if(!norm(v)){inp.focus();return}
        done=true;inp.disabled=true;
        const ok=q.open.some(x=>norm(x)===norm(v));
        if(ok)score++;
        $("fb").innerHTML=ok?`<div class="fb ok">✅ To'g'ri!</div>`:`<div class="fb no">❌ To'g'ri javob: <b>${esc(q.open[0])}</b></div>`;
        ck.textContent=i+1>=qs.length?"Natijani ko'rish":"Keyingisi";
      };
      ck.onclick=check;
      inp.onkeydown=e=>{if(e.key==="Enter")check()};
      inp.focus();
    }
  };
  draw();
}

menu();
if("serviceWorker"in navigator)navigator.serviceWorker.register("tz1v2-sw.js").catch(()=>{});
</script>
