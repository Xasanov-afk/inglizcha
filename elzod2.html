<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174270">
<link rel="manifest" href="elzod2-manifest.json">

<title>ENGLISH TILZINA 2</title>
<style>
:root{--bg:#f2f7fc;--card:#fff;--p:#1b6fae;--p2:#e6f2fb;--t:#0f2a4a;--m:#6b7280;--ok:#16a34a;--no:#dc2626;--okbg:#dcfce7;--nobg:#fee2e2;--sh:0 1px 3px rgba(0,0,0,.1);--gold:#f5a623}
@media(prefers-color-scheme:dark){:root{--bg:#0a1a2e;--card:#12294a;--p:#4cb8ea;--p2:#1a3a60;--t:#eaf4fb;--m:#9ca3af;--okbg:#14532d;--nobg:#7f1d1d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:6px 0 14px}h2{font-size:20px;margin:6px 0 10px}
button{font-family:inherit}
.face{display:block;width:100%;border-radius:22px;box-shadow:0 6px 18px rgba(11,31,56,.25);margin-bottom:14px}
.hi{font-size:20px;font-weight:700;margin:2px 0 10px}
.hero{display:flex;gap:10px;margin-bottom:16px}
.hero>div{flex:1;background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--sh)}
.hero b{display:block;font-size:18px}.hero span{font-size:12px;color:var(--m)}
.menu{display:flex;flex-direction:column;align-items:flex-start;width:100%;background:var(--card);color:var(--t);border:0;border-radius:18px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh);cursor:pointer;text-align:left;position:relative}
.menu i{font-style:normal;font-size:28px;position:absolute;right:18px;top:50%;transform:translateY(-50%)}
.menu b{font-size:19px}.menu span{font-size:13px;color:var(--m);margin-top:2px}
.menu.sm{margin:0;padding:14px 14px 14px;min-height:84px}.menu.sm i{font-size:24px;right:12px;top:14px;transform:none}.menu.sm b{font-size:16px;padding-right:30px}.menu.sm span{font-size:12px}
.back{background:none;border:0;color:var(--p);font-size:16px;padding:8px 0;cursor:pointer}
.sec{font-size:13px;font-weight:600;color:var(--m);margin:20px 0 8px;letter-spacing:.04em}
.meta{font-size:13px;color:var(--m)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{aspect-ratio:1;background:var(--card);border-radius:12px;box-shadow:var(--sh);position:relative;display:flex;align-items:center;justify-content:center;font-size:26px}
.cell small{position:absolute;top:4px;left:6px;font-size:10px;color:var(--m)}
.cell.fut{opacity:.45;font-size:16px;color:var(--m)}
.cell.now{outline:3px solid var(--p)}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:16px;font-size:14px;color:var(--m)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);color:var(--t);border:2px solid transparent;border-radius:14px;padding:10px 12px;text-align:left;box-shadow:var(--sh);cursor:pointer;min-height:64px;display:flex;flex-direction:column;justify-content:center}
.tile b{font-size:13px;color:var(--p)}.tile span{font-size:14px;line-height:1.25;margin-top:2px}
.tile.lock{opacity:.5}.tile.done{border-color:var(--ok)}
.words{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:4px 14px}
.wr{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--p2)}
.wr:last-child{border:0}.wr .n{width:22px;color:var(--m);font-size:13px;padding-top:3px}
.wr .c{flex:1}.wr .e{font-weight:700;font-size:17px}.wr .u{color:var(--p);font-weight:600;margin-left:6px}
.wr .x{font-size:14px;margin-top:3px}.wr .y{font-size:13px;color:var(--m)}
.spk{border:0;background:var(--p2);color:var(--p);border-radius:99px;width:38px;height:38px;font-size:17px;cursor:pointer;flex:none}
button.big{width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:600;cursor:pointer;margin-top:12px;background:var(--p);color:#fff}
@media(prefers-color-scheme:dark){button.big:not(.alt){color:#06223d}}
button.alt{background:var(--card);color:var(--p);box-shadow:var(--sh)}
.box{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px 16px;line-height:1.55;font-size:16px}
.box p{margin:0 0 10px}.box p:last-child{margin:0}
.ex{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--p2)}
.ex:last-child{border:0}.ex b{font-weight:600}.ex span{color:var(--m);font-size:14px}
.bar{height:8px;background:var(--p2);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--p);border-radius:99px;transition:width .3s}
.q{font-size:24px;font-weight:700;text-align:center;margin:20px 0;line-height:1.3}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--t);border:2px solid transparent;border-radius:14px;padding:14px 16px;font-size:17px;margin-bottom:10px;cursor:pointer;box-shadow:var(--sh)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--nobg);border-color:var(--no)}
input.in{width:100%;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid var(--p2);background:var(--card);color:var(--t);outline:none}
input.in:focus{border-color:var(--p)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:16px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.center{text-align:center}.score{font-size:56px;font-weight:800;color:var(--p);margin:12px 0}
.stars{font-size:38px;letter-spacing:4px;margin:4px 0}
.gifts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gift{aspect-ratio:1;background:var(--card);border-radius:14px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;border:2px solid transparent;cursor:pointer;color:var(--t);padding:0}
.gift small{font-size:11px;color:var(--m);margin-top:2px}
.gift.off{opacity:.4;filter:grayscale(1)}.gift.on{border-color:var(--gold)}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--p2);font-size:15px}
.row:last-child{border:0}.row b{color:var(--p)}
.cert{width:100%;border-radius:10px;box-shadow:var(--sh);display:block;margin-top:8px}
.two{display:flex;gap:10px}.two button{flex:1}
.err{padding:10px 0;border-bottom:1px solid var(--p2)}.err:last-child{border:0}
.err b{display:block}.err span{font-size:14px;color:var(--ok)}
.ov{position:fixed;inset:0;background:linear-gradient(160deg,#1f5f9e,#174270 45%,#0b1f38);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.ov .card{background:#fff;color:#0f2a4a;border-radius:22px;padding:24px 20px;width:100%;max-width:420px;text-align:center}
.ov input{width:100%;font-size:18px;padding:13px 14px;border-radius:12px;border:2px solid #cfe1f0;margin-top:10px;outline:none;color:#0f2a4a;background:#fff}
.ov button{width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;background:#1b6fae;color:#fff;margin-top:14px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);background:#174270;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:92vw;text-align:center}
#toast.on{transform:translateX(-50%);opacity:1}
</style>
</head>

window.P2_GRAMMAR=(window.P2_GRAMMAR||[]).concat([
  {t:"Present Perfect: shakli va darak gap",
  rule:"Present Perfect o'tgan ishning hozirgi payt bilan aloqasini yoki natijasini ko'rsatadi.\nShakli: have/has + V3 (fe'lning 3-shakli).\nI, you, we, they + have; he, she, it + has.\nTo'g'ri fe'llarda V3 = V2: work - worked, finish - finished.\nNoto'g'ri fe'llarda V3 alohida yodlanadi: go - gone/been, see - seen, eat - eaten, write - written.\nMasalan: I have finished my homework. (Uy vazifam tayyor.)",
  ex:[["I have finished my homework.","Men uy vazifamni tugatdim."],["She has bought a new phone.","U yangi telefon sotib olgan."],["We have seen this film.","Biz bu filmni ko'rganmiz."],["He has written a letter.","U xat yozgan."],["They have lived here for years.","Ular bu yerda yillardan beri yashaydi."],["It has broken my window.","U mening oynamni sindirib qo'ygan."]],
  q:[
  {q:"She has ___ to Paris.",o:["go","went","been","going"],a:2},
  {q:"I have ___ my homework.",o:["done","did","do","doing"],a:0},

  {t:"Past Continuous: was/were + -ing",

  ex:[["I was walking when I saw an accident.","Men ketayotib, baxtsiz hodisani ko'rdim."],["While she was cooking, the phone rang.","U ovqat pishirayotganda telefon jiringladi."],["He fell while he was running.","U yugurayotganda yiqildi."],["When I arrived, they were having dinner.","Men kelganimda ular kechki ovqat yeyayotgan edi."],["It was raining when we left.","Biz chiqqanimizda yomg'ir yog'ayotgan edi."],["What were you doing when I called?","Men qo'ng'iroq qilganimda nima qilayotgan eding?"]],

  {q:"It ___ when we left the house.",o:["was raining","rain","rains","raining"],a:0},

  {t:"Zero conditional: If + present, present",
  rule:"Zero conditional umumiy haqiqatlar va doimiy natijalar uchun ishlatiladi.\nShakli: If + Present Simple, Present Simple.\nMasalan: If you heat ice, it melts. (Muzni isitsangiz, u erib ketadi.)\nIkkala qismda ham Present Simple bo'ladi, will ishlatilmaydi.\nIf qismi oldin kelsa, vergul qo'yiladi: If it rains, I stay at home.\nGap tartibini almashtirish mumkin: I stay at home if it rains. Bu holda vergul kerak emas.",
  ex:[["If you heat ice, it melts.","Muzni isitsangiz, u eriydi."],["If it rains, the grass gets wet.","Yomg'ir yog'sa, o't ho'l bo'ladi."],["If I am tired, I go to bed early.","Charchasam, erta yotaman."],["Plants die if they don't get water.","O'simliklar suv olmasa, nobud bo'ladi."],["If you mix red and blue, you get purple.","Qizil va ko'kni aralashtirsangiz, binafsha rang chiqadi."],["If he drinks coffee at night, he can't sleep.","U kechqurun qahva ichsa, uxlay olmaydi."]],

  {q:"If it rains, the grass ___ wet.",o:["got","getting","to get","gets"],a:3},
  {q:"If you ___ water to 100 degrees, it boils.",o:["heat","will heat","heated","heating"],a:0},
  {q:"If I ___ tired, I go to bed early.",o:["will be","was","am","being"],a:2},
  {q:"Plants die if they ___ water.",o:["won't get","don't get","didn't get","not get"],a:1},
  {q:"If you mix red and blue, you ___ purple.",o:["got","getting","will got","get"],a:3},
  {q:"If he ___ coffee in the evening, he can't sleep.",o:["drinks","drink","drank","drinking"],a:0},
  {q:"If you don't eat, you ___ hungry.",o:["became","becoming","get","gets"],a:2},
  {q:"Choose the correct sentence.",o:["If you will cool water, it freezes.","If you cool water, it freezes.","If you cooled water, it freeze.","If you cool water, it freeze."],a:1},
  {q:"If people ___ enough sleep, they feel bad.",o:["doesn't get","not get","won't get","don't get"],a:3},

  ]},

  {t:"First conditional: If + present, will",
  rule:"First conditional kelajakdagi real imkoniyat va uning natijasi uchun ishlatiladi.\nShakli: If + Present Simple, will + fe'l.\nMasalan: If it rains tomorrow, we will stay at home. (Ertaga yomg'ir yog'sa, uyda qolamiz.)\nIf dan keyin will ishlatilmaydi! Faqat natija qismida will bo'ladi.\nInkor: If you don't hurry, you will miss the bus. won't = will not.\nIf qismi gapning oxirida kelsa, vergul kerak emas: I will call you if I have time.",
  ex:[["If it rains tomorrow, we will stay at home.","Ertaga yomg'ir yog'sa, uyda qolamiz."],["If you study, you will pass the exam.","O'qisangiz, imtihondan o'tasiz."],["I will call you if I have time.","Vaqtim bo'lsa, senga qo'ng'iroq qilaman."],["If he misses the bus, he will be late.","U avtobusga ulgurmasa, kech qoladi."],["We won't go out if it rains.","Yomg'ir yog'sa, tashqariga chiqmaymiz."],["What will you do if you lose?","Yutqazsangiz, nima qilasiz?"]],

  {t:"may / might: ehtimol",
  rule:"may va might biror narsa ehtimol bo'lishini bildiradi, ya'ni ishonch kam.\nShakli: may/might + fe'lning asosiy shakli (to siz).\nMasalan: It may rain tomorrow. (Ertaga yomg'ir yog'ishi mumkin.)\nHamma shaxslar uchun bir xil: he may, she might (s qo'shilmaydi).\nInkor: may not, might not. Masalan: She might not come.\nmight ehtimolni biroz kuchsizroq ko'rsatadi, lekin ikkalasi ko'pincha bir xil ma'noda ishlatiladi.",

  {t:"must / mustn't / don't have to",
  rule:"must - majburiyat: You must do your homework. (Qilishingiz shart.)\nmustn't - taqiq: You mustn't smoke here. (Bu yerda chekish mumkin emas.)\ndon't have to - majburiy emas, xohlasangiz qilasiz: You don't have to come. (Kelishingiz shart emas.)\nmustn't va don't have to ma'nosi butunlay boshqa, ularni adashtirmang!\nmust dan keyin fe'lning asosiy shakli keladi (to siz): must go, mustn't touch.\nhe/she/it bilan: doesn't have to.",

  {t:"Gerund: fe'l + -ing",
  rule:"Ba'zi fe'llardan keyin ikkinchi fe'l -ing shaklida (gerund) keladi.\nBunday fe'llar: like, love, enjoy, hate, mind, finish, stop, start.\nMasalan: I enjoy reading. She likes swimming. He finished cleaning.\nstop + -ing: biror ishni to'xtatish: Stop talking!\nGerund predloglardan keyin ham ishlatiladi: good at swimming, thank you for helping.\nGap boshida ega bo'lib ham keladi: Swimming is good for you. (Suzish foydali.)",
  ex:[["I enjoy listening to music.","Men musiqa tinglashni yoqtiraman."],["She likes reading books.","U kitob o'qishni yaxshi ko'radi."],["They finished cleaning the room.","Ular xonani tozalashni tugatdi."],["He stopped talking.","U gapirishni to'xtatdi."],["Swimming is good for you.","Suzish siz uchun foydali."],["Thank you for helping me.","Menga yordam berganingiz uchun rahmat."]],

  {t:"Infinitive: fe'l + to",
  rule:"Ba'zi fe'llardan keyin to + fe'l (infinitive) keladi.\nBunday fe'llar: want, decide, hope, plan, need, learn, promise.\nMasalan: I want to buy a car. She decided to study abroad.\nMaqsad bildirish uchun ham to + fe'l ishlatiladi: I went to the shop to buy bread. (Non olish uchun do'konga bordim.)\nSavol: Why...? - To + fe'l bilan javob beramiz.\nInkor: not to + fe'l: He decided not to go.",

  {t:"too va enough",
  rule:"too + sifat/ravish: ortiqcha, kerakdan ko'p. Ko'pincha salbiy natija beradi.\nMasalan: It's too cold. (Juda sovuq, chidab bo'lmaydi.) too much + sanalmaydigan, too many + sanaladigan ot.\nsifat + enough: yetarlicha. He is old enough to drive. (U mashina haydash uchun yetarli yoshda.)\nenough + ot: yetarli miqdor. We have enough money.\ntoo + sifat + to + fe'l: It's too hot to drink. (Ichish uchun juda issiq.)\nInkor: not + sifat + enough: The soup isn't hot enough.",
  ex:[["It's too cold to swim today.","Bugun suzish uchun juda sovuq."],["He is old enough to drive.","U mashina haydashga yetarli yoshda."],["The coffee is too hot.","Qahva juda issiq."],["We have enough money.","Bizda pul yetarli."],["There are too many people here.","Bu yerda odam juda ko'p."],["The soup isn't hot enough.","Sho'rva yetarli darajada issiq emas."]],

  {t:"Relative clauses: who, which, that",
  rule:"Relative clause ot haqida qo'shimcha ma'lumot beradi va gaplarni bog'laydi.\nwho - odamlar uchun: The man who lives next door is a doctor.\nwhich - narsa va hayvonlar uchun: The book which I like is new.\nthat - odam va narsa uchun ishlatiladi: A bus is a vehicle that carries people.\nwho/which/that o'zi ega o'rnida kelsa, undan keyin darhol fe'l bo'ladi.\nBu so'zlar ikki gapni birlashtiradi: I know a girl. She speaks French. - I know a girl who speaks French.",
  ex:[["The man who lives next door is a doctor.","Qo'shni uyda yashaydigan odam shifokor."],["This is the book which I like.","Bu men yoqtiradigan kitob."],["A teacher is a person who teaches.","O'qituvchi o'qitadigan kishi."],["I have a dog that likes bones.","Mening suyakni yaxshi ko'radigan itim bor."],["The bag that is on the table is mine.","Stol ustidagi sumka meniki."],["I know a girl who speaks French.","Men fransuz tilida gapiradigan qizni bilaman."]],

  {t:"Used to: o'tgan odat",
   rule:"Used to o'tgan zamondagi odat yoki holatni bildiradi. Ilgari shunday bo'lgan, endi bunday emas.\nShakli: used to + fe'lning 1-shakli.\nI used to play football. (Ilgari futbol o'ynardim.)\nInkor: didn't use to (use, used emas!).\nSo'roq: Did you use to live here?\nHolat uchun ham ishlatiladi: There used to be a cinema here.\nDiqqat: used to + V1 (odat) va be used to + -ing (ko'nikkan) boshqa-boshqa narsa.",

  {t:"Much, many, a lot of, a few, a little",
   rule:"Sanaladigan otlar (apple, book) bilan: many, a few, few.\nSanalmaydigan otlar (water, time) bilan: much, a little, little.\nA lot of / some ikkalasi bilan ham ishlatiladi: a lot of books, a lot of water.\nMuhim farq: a few / a little = bir oz bor (yaxshi). few / little = deyarli yo'q (yomon). I have a few friends. I have few friends.\nSome darak gapda, any inkor va so'roq gapda: I have some milk. I don't have any milk. Do you have any milk?\nTaklif va iltimosda some ishlatiladi: Would you like some tea?",
   ex:[["How much water do you drink?","Siz qancha suv ichasiz?"],["How many books have you got?","Sizda nechta kitob bor?"],["I have a few friends here.","Bu yerda bir nechta do'stim bor."],["There is a little milk in the fridge.","Muzlatgichda ozgina sut bor."],["We haven't got any sugar.","Bizda umuman shakar yo'q."],["Would you like some tea?","Choy xohlaysizmi?"]],

  {t:"Question tags (so'roq dumchalar)",
   rule:"Question tag gap oxiridagi qisqa savol bo'lib, \"shunday emasmi?\" ma'nosini beradi. Biz fikrni tasdiqlatmoqchi bo'lganimizda ishlatamiz.\nDarak gap bo'lsa, tag inkor: You are a student, aren't you?\nInkor gap bo'lsa, tag darak: You aren't a student, are you?\nTag gapdagi yordamchi fe'lni takrorlaydi: is/are/can/will/has. Yordamchi fe'l bo'lmasa: do/does/did.\nShe likes tea, doesn't she? They went home, didn't they?\nMaxsus: I am late, aren't I?\nTag ot emas, olmosh bilan boshlanadi: Ali is late, isn't he?",
   ex:[["You are a student, aren't you?","Siz talabasiz, shunday emasmi?"],["She likes tea, doesn't she?","U choyni yaxshi ko'radi, shunday emasmi?"],["They aren't at home, are they?","Ular uyda emas, to'g'rimi?"],["He can swim, can't he?","U suzishni biladi, shunday emasmi?"],["We went to the park, didn't we?","Biz bog'ga bordik, shunday emasmi?"],["I am late, aren't I?","Men kechikdim, shunday emasmi?"]],
   q:[{q:"You are a student, ___?",o:["are you","aren't you","don't you","isn't you"],a:1},
{q:"She likes tea, ___?",o:["isn't she","doesn't she","does she","don't she"],a:1},

  {t:"Ikkinchi shart gap (If I had...)",
   rule:"Ikkinchi shart gap hozirgi yoki kelajakdagi xayoliy, real bo'lmagan vaziyat haqida.\nShakli: If + o'tgan zamon, would + V1.\nIf I had a lot of money, I would buy a big house. (Pulim ko'p bo'lsa edi, katta uy sotib olardim. Lekin hozir puli yo'q.)\nIf so'ngida be fe'li hamma shaxs bilan were bo'ladi: If I were you, I would call him. (Sizning o'rningizda bo'lsam...)\nSavol: What would you do if you won a million dollars?\nDiqqat: if qismida would ishlatilmaydi: If I had..., emas If I would have...",
   ex:[["If I had a lot of money, I would buy a big house.","Pulim ko'p bo'lsa, katta uy sotib olardim."],["If she studied harder, she would pass the exam.","U ko'proq o'qisa, imtihondan o'tardi."],["If I were you, I would call him.","Sizning o'rningizda bo'lsam, unga qo'ng'iroq qilardim."],["What would you do if you won a million dollars?","Million dollar yutsangiz, nima qilardingiz?"],["If we lived near the sea, we would swim every day.","Dengiz yonida yashasak, har kuni suzardik."],["I wouldn't take that job if I were you.","Sizning o'rningizda bo'lsam, u ishni olmasdim."]],

   rule:"Present Perfect Continuous harakat o'tmishda boshlanib, hozirgacha davom etayotganini yoki hozirgina tugaganini ko'rsatadi.\nShakli: have / has + been + V-ing.\nI have been waiting for two hours. (Ikki soatdan beri kutyapman.)\nShe has been learning English since 2020.\nSo'roq: How long have you been living here?\nSince = boshlangan vaqt nuqtasi (since 2020, since Monday). For = davomiylik (for two hours, for ten years).\nNatija ko'rinib turganda ham ishlatiladi: My hands are dirty because I have been working in the garden.",
   ex:[["I have been waiting for two hours.","Ikki soatdan beri kutyapman."],["She has been learning English since 2020.","U 2020-yildan beri ingliz tilini o'rganyapti."],["It has been raining all day.","Kun bo'yi yomg'ir yog'yapti."],["How long have you been living here?","Siz bu yerda qancha vaqtdan beri yashayapsiz?"],["They have been playing football for an hour.","Ular bir soatdan beri futbol o'ynayapti."],["Why are your eyes red? I have been crying.","Nega ko'zlaringiz qizargan? Yig'lagan edim."]],

  {t:"Past Perfect (kirish)",
   rule:"Past Perfect o'tmishdagi ikki voqeadan oldin bo'lganini bildiradi.\nShakli: had + V3. Hamma shaxs uchun had.\nWhen I arrived, the film had already started. (Men kelganimda film allaqachon boshlangan edi.)\nAvval bo'lgan ish Past Perfect, keyingisi Past Simple bilan aytiladi.\nInkor: hadn't + V3. So'roq: Had you finished work before the meeting started?\nOdatda before, after, when, by the time, already, never ... before so'zlari bilan keladi.\nAfter she had cooked dinner, she watched TV.",
   ex:[["When I arrived, the film had already started.","Men kelganimda film allaqachon boshlangan edi."],["She had eaten before I came.","Men kelgunimcha u ovqatlangan edi."],["He was sad because he had lost his keys.","U kalitlarini yo'qotgani uchun xafa edi."],["By the time we got to the station, the train had left.","Bekatga yetib borganimizda poyezd ketib bo'lgan edi."],["They had never seen snow before they visited Canada.","Ular Kanadaga borguncha hech qachon qor ko'rmagan edi."],["I couldn't enter because I had left my key at home.","Kalitimni uyda qoldirganim uchun kira olmadim."]],

  {t:"O'zlik olmoshlari (myself...)",
   rule:"Ega va ob'ekt bir kishi bo'lsa, o'zlik olmoshi ishlatiladi: I cut myself. (Men o'zimni kestirib oldim.)\nShakllar: myself, yourself, himself, herself, itself, ourselves, yourselves, themselves.\nBirlik -self, ko'plik -selves: yourself (siz bir kishi), yourselves (sizlar).\nOddiy olmosh (me, him) boshqa kishini bildiradi: She looked at her. (boshqa odamga). She looked at herself. (o'ziga)\nBy + o'zlik olmoshi = yolg'iz, hech kimsiz: I did it by myself.\nEnjoy yourself! = Yaxshi dam oling!",
   ex:[["I cut myself yesterday.","Kecha o'zimni kesib oldim."],["She looked at herself in the mirror.","U ko'zguda o'ziga qaradi."],["We enjoyed ourselves at the party.","Ziyofatda yaxshi vaqt o'tkazdik."],["They taught themselves to play the guitar.","Ular gitarada chalishni o'zlari o'rganishdi."],["I did my homework by myself.","Uy vazifamni o'zim bajardim."],["Help yourselves to some cake, children!","Bolalar, pirogdan oling!"]],

  {t:"Bog'lovchi so'zlar",

   ex:[["I was tired, so I went to bed early.","Charchagan edim, shuning uchun erta uxlab qoldim."],["I went to bed early because I was tired.","Charchagan bo'lganim uchun erta uxladim."],["She is rich, but she isn't happy.","U boy, lekin baxtli emas."],["Although it was raining, we played outside.","Yomg'ir yog'ayotgan bo'lsa ham, tashqarida o'ynadik."],["He studied hard. However, he failed the exam.","U qattiq o'qidi. Biroq imtihondan o'ta olmadi."],["I like tea and coffee.","Men choy va qahvani yaxshi ko'raman."]],

  {t:"Ish va ofis",title:"A Day at the Bank",text:"Anna works in a bank in Tashkent. She is a manager. Every morning she wakes up at six o'clock and goes to the office by metro. Her working day starts at nine and finishes at six.\n\nIn the office, Anna has a small desk, a computer and a phone. She answers emails, talks to customers and goes to meetings. On Mondays she has a big meeting with her team. There are five people in her team, and she likes them very much.\n\nAt one o'clock, Anna has lunch with her colleague Dilnoza. They usually eat in a small cafe near the bank. Sometimes they talk about work, but they also talk about films and holidays.\n\nLast week Anna was very busy. She wrote a long report for her boss and finished it on Friday. Her boss said, \"Good job, Anna!\" Now Anna is happy because she has a day off tomorrow. She wants to sleep late and visit her mother.",q:[

  {t:"Pul va bank",title:"My First Bank Card",text:"Subject: My first bank card\n\nHi Sardor,\n\nYesterday I went to the bank and opened my first account. I was a little nervous, but the bank clerk was very kind. She asked for my passport and I filled in a form. After twenty minutes I had a new bank card.\n\nNow I can pay in shops with my card, and I can also use my phone. I do not need to carry a lot of cash. My salary comes to the card every month, and I can see it in the bank app.\n\nI want to save money this year. Every month I will put 200,000 soums into a savings account. The bank pays interest, so my money will grow a little. I want to buy a laptop in December, but it costs five million soums. It is expensive, so I must spend less on snacks and taxis.\n\nDo you have a card? Please tell me about it.\n\nBest wishes,\nBobur",q:[

  {t:"Ijara va uy-joy",title:"Looking for a Flat",text:"Malika: Hello, I am calling about the flat on Navoi Street.\nMr. Karimov: Yes, it is still free. It has two bedrooms, a living room and a kitchen. It is on the third floor.\nMalika: Is there a lift?\nMr. Karimov: No, there is not.\nMalika: How much is the rent?\nMr. Karimov: It is 3,000,000 soums a month. You must also pay for gas, water and electricity.\nMalika: Is the flat furnished?\nMr. Karimov: Yes. There is a sofa, a table, two beds and a fridge.\nMalika: Is it near a bus stop?\nMr. Karimov: Yes, the bus stop is only five minutes away. There is also a small park and a supermarket nearby.\nMalika: Can I see it tomorrow at ten o'clock?\nMr. Karimov: Of course. I will wait for you in front of the building. Please bring your passport, because we need to sign a contract if you like the flat.\nMalika: Thank you very much. See you tomorrow!",q:[

  {t:"Internet va ijtimoiy tarmoqlar",title:"My Week Without Social Media",text:"Last month I decided to try something new. I turned off all my social media apps for one week. I usually spend about four hours a day on my phone, so I wanted to see what would happen.\n\nOn the first day, I felt strange. I kept picking up my phone, but there was nothing to check. On the second day I felt a little better. I read a book and I called my grandmother. She was very happy to hear my voice, because I usually send her only a short message.\n\nBy the fifth day, I was sleeping better. I did not look at my screen before bed, and I woke up early without an alarm. I also went for a walk every evening with my brother.\n\nOf course, the internet is not bad. I use it to study English, watch videos and talk to friends who live abroad. But now I know that I need a balance. These days I use social media for only one hour a day. I think it is enough. Maybe you should try this experiment too!",q:[

  {t:"Onlayn xarid",title:"My New Jacket",text:"Last Friday, I bought a jacket on a big website. It was blue and it cost 400,000 soums. I paid with my bank card and chose home delivery.\n\nThe website said, \"Your parcel will arrive in three days.\" But I waited for five days! Finally, a courier brought the box to my door. I opened it quickly, but the jacket was too small. I ordered size M, but they sent size S.\n\nI was a little angry, so I wrote to customer service. A woman answered in ten minutes. She said sorry and sent me a new jacket. The shop also gave me a ten percent discount for my next order.\n\nTwo days later, the right jacket arrived, and it looked great. I gave the website four stars. Online shopping is easy, but now I always check the size and the delivery time before I click \"Buy\".",q:[

  {t:"Tashqi ko'rinish",title:"My Family Photo",text:"Look at this photo of my family. It is from my cousin's wedding last summer.\n\nMy father is the tall man in the middle. He is fifty years old, and he has short grey hair and a big moustache. He wears glasses when he reads. My mother is standing next to him. She is thin and has long black hair. She has beautiful brown eyes and a kind smile. In the photo she is wearing a long red dress and gold earrings.\n\nMy older brother, Timur, is on the left. He is very handsome, and he is strong because he goes to the gym every day. He has a short beard and curly hair. People say we look the same, but I do not agree. He is taller than me!\n\nAnd this is me. I am medium height, and I have straight brown hair and green eyes, which is unusual in my family. I am wearing a dark blue suit and a white shirt. I was nervous because I had to make a speech.\n\nMy little sister is the girl with the yellow bow in her hair. She is only six, but she is already very pretty. Everybody loves her.",q:[

  {t:"Xarakter va shaxs",title:"My Two Best Friends",text:"I have two best friends, and they are very different.\n\nZarina is the most talkative person I know. She is friendly and funny, and she loves meeting new people. At parties, she is never alone. She is also very confident, so she is not afraid to speak in front of a big group. But sometimes she is late for everything, and she forgets things. Last week she forgot my birthday!\n\nJasur is the opposite. He is shy and quiet, and he does not like big parties. He prefers to stay at home and read books or play chess. But he is also very kind and patient. When I have a problem, he always listens carefully and gives good advice. He is hard-working too: he studies eight hours a day because he wants to be a doctor.\n\nI think I am somewhere in the middle. I am not as shy as Jasur, but I am not as loud as Zarina. People say I am calm and honest.\n\nSome people ask me, \"How can you be friends with such different people?\" The answer is easy. Zarina makes me laugh, and Jasur makes me think. Together, we are a perfect team.",q:[

  {t:"His-tuyg'ular",title:"Exam Day",text:"Dear diary,\n\nToday was a very strange day. I woke up at six o'clock feeling nervous because I had an important English exam. My stomach hurt, and I could not eat breakfast. My mother said, \"Do not worry. You studied hard!\" I tried to smile, but I was too afraid.\n\nOn the way to school, I met my friend Kamola. She looked worried too. We sat together on the bus and said nothing. When we arrived, the teacher gave us the papers. I looked at the first question, and suddenly I felt calm. It was easy! I knew the answer. The reading part was a little difficult, but I did my best.\n\nAfter the exam, I was so tired, but also very proud of myself. Then something surprising happened. My teacher came to me and said, \"Great work, Aziza!\" I was shocked, because the results were not ready yet. She told me that she looked at my answers and they were nearly perfect.\n\nI was so happy that I wanted to jump and shout. I called my mother and told her the news. She cried because she was so glad. Tonight I feel relaxed and grateful. I am going to sleep early.\n\nAziza",q:[

  {t:"Munosabatlar",title:"A Letter to Nargiza",text:"Dear Nargiza,\n\nI have a problem with my best friend, Madina. We have been friends for ten years, and we always tell each other everything. Last month, Madina got a new boyfriend, and now she never has time for me. She does not answer my messages, and she cancelled our plans three times. I feel lonely and a little jealous. What should I do?\n\nSevara\n\nDear Sevara,\n\nThank you for your letter. I understand your feelings. When a friend starts a new relationship, it can be hard. But this is normal, and it does not mean that Madina does not love you.\n\nFirst, do not be angry. Instead, call her and ask to meet. Say, \"I miss you. Can we have tea on Saturday?\" Talk honestly about how you feel, but be kind and do not blame her. A good friend will listen.\n\nSecond, try to meet her boyfriend. Maybe he is a nice person, and you can all become friends. Also, spend time with other people. Join a club, visit your cousins, or call your grandmother. You do not have to wait for Madina.\n\nRemember that real friendship needs trust and time. After ten years, I am sure your friendship is strong.\n\nGood luck,\nNargiza",q:[

  {t:"Bayramlar va an'analar",title:"Navruz in My Family",text:"Navruz is my favourite holiday. We celebrate it on 21 March, when spring begins. For many people in Uzbekistan, it is the start of a new year.\n\nA week before Navruz, my family cleans the house from top to bottom. My mother says that we must start the new year with a clean home. We also buy new clothes and visit our neighbours. In the streets, people plant trees and flowers, and cities organise big concerts and fairs.\n\nThe most important part is the food. My grandmother always cooks sumalak. It is a sweet dish made from young wheat and flour. She starts at night and stirs the pot for many hours. The women of our street sing songs and tell stories while they cook. In the morning, we all taste it and make a wish. We also eat samsa, halva and, of course, plov.\n\nIn my country, plov is the heart of every celebration. At weddings, a big pot of plov feeds hundreds of guests, and the men cook it early in the morning. My cousin got married last autumn, and we ate plov for breakfast!\n\nFor me, Navruz and weddings are more than food. They bring the family together, and they remind me of our traditions. Happy Navruz to everyone!",q:[

    {q:"What does the writer's mother say about the home?",o:["It must be clean at the start of the new year","It must be new","It must be big","It must be warm"],a:0},

    {q:"Who cooks plov at weddings?",o:["The women","The children","The guests","The men"],a:3},

  {t:"Davlatlar va millatlar",title:"My International Class",text:"On the first day of English class, our teacher asked us to introduce ourselves. I was surprised because our class is really international!\n\nMy name is Rustam, and I am from Samarkand, Uzbekistan. I am Uzbek, and I speak Uzbek, Russian and a little English.\n\nThe girl next to me is Yuki. She is Japanese and comes from Osaka. She is a student, and she wants to study business in London. She says that Japanese food is the best in the world, and I agree because I love sushi.\n\nBehind me is Carlos from Brazil. He is Brazilian, and he plays football very well. His mother is Italian, so he speaks Portuguese and Italian. He wants to visit Uzbekistan because he loves old cities. I told him, \"You must see Samarkand and Bukhara!\"\n\nNext to Carlos is Fatima. She is from Egypt, so she is Egyptian. Her country is very hot, and she cannot stand the cold weather here. She often wears two jackets!\n\nThe last student is Hans, a German engineer. He lives in Berlin but works in Turkey. He is the oldest person in our class.\n\nAfter the lesson, we all went to a cafe. We spoke English together, and it was difficult but also fun. I think this class will be great.",q:[

  {t:"Mehmonxona",title:"Review: Silk Road Hotel",text:"Review: Silk Road Hotel, Bukhara\nRating: 4 out of 5 stars\n\nMy husband and I stayed at the Silk Road Hotel for three nights last April. We booked a double room online two months before, and the price was 600,000 soums per night with breakfast.\n\nWhen we arrived, the receptionist welcomed us with a smile and a cup of green tea. We showed our passports and filled in a form. She gave us the key to room 204 on the second floor. A porter carried our heavy suitcases, which was very helpful.\n\nThe room was clean and bright. It had a big bed, a small table, a TV and a fridge. From our window, we could see a beautiful old madrasa. However, there was a problem: the air conditioner did not work, and the night was hot. I called reception, and a technician fixed it in fifteen minutes.\n\nBreakfast was delicious. We ate eggs, bread, cheese, fruit and local honey every morning. The restaurant is on the roof, so you can eat and look at the city.\n\nCheck-out is at twelve o'clock, but they let us leave our bags at reception until the evening. The Wi-Fi was slow, but the staff were polite and helpful. We will definitely come back next year!",q:[

  {t:"Aeroport",title:"Gulnora's First Flight",text:"Last summer, my sister Gulnora flew from Tashkent to Istanbul for the first time. She was excited but also nervous, so she arrived at the airport three hours early.\n\nFirst, she went to the check-in desk. The woman there asked for her passport and ticket. Gulnora put her big suitcase on the scale. It was fine, and the woman gave her a boarding pass. \"Your gate is number 12,\" she said.\n\nNext, Gulnora went through security. A guard asked her to open her bag because there was a big bottle of water inside. She had to throw it away. \"I forgot about that rule,\" she said with a laugh.\n\nAfter security, she had two hours before the flight. She bought a coffee and a magazine, and she walked around the duty-free shop. She wanted to buy chocolate, but it was too expensive. Then she heard an announcement: \"Passengers to Istanbul, please go to gate 12.\" The flight was delayed by twenty minutes, but finally she got on the plane and found her seat next to the window.\n\nThe flight took four hours. When the plane landed, Gulnora was tired but very happy. \"Next time,\" she said, \"I will arrive only two hours early!\"",q:[

  {t:"Yo'l so'rash",title:"How Do I Get to the Registan?",text:"Tourist: Excuse me, can you help me? I am looking for the Registan.\nLocal man: Of course! It is not far from here. Are you walking?\nTourist: Yes, I am.\nLocal man: Good. Go straight along this street for two hundred metres. You will pass a big blue bank on your left.\nTourist: Straight on, and the bank is on the left. OK.\nLocal man: Then turn right at the traffic lights. You will see a small park with a fountain. Walk through the park, and cross the road at the zebra crossing.\nTourist: Is it difficult to find?\nLocal man: No, it is easy. After the crossing, turn left. The Registan is at the end of that street, opposite the big hotel. It takes about fifteen minutes on foot.\nTourist: That is great. Is there a bus?\nLocal man: Yes, bus number 15 stops over there, behind the pharmacy. But it is slow in the morning because of traffic.\nTourist: I think I will walk. Is there a cafe near the Registan?\nLocal man: Yes, there is a nice one next to the ticket office, between the museum and the souvenir shop.\nTourist: Thank you so much for your help.\nLocal man: You are welcome! Enjoy your visit.",q:[

  {t:"Sog'liq muammolari",title:"A Week With the Flu",text:"Last Monday, I woke up feeling terrible. My head hurt, my throat was sore and I had a high temperature. I also had a bad cough, and I felt very tired. I thought, \"It is only a cold. I will drink some tea and go to work.\" But by lunchtime, I could hardly stand, so my boss told me to go home.\n\nMy mother called our family doctor, and he came to see me in the evening. First, he took my temperature. It was thirty-nine degrees! Then he listened to my chest and looked at my throat.\n\n\"You have the flu,\" he said. \"You need to stay in bed for at least four days.\"\n\nHe wrote a prescription and said, \"Take this medicine three times a day, after meals. Drink plenty of water and warm tea with lemon and honey. Do not go out, and do not do any sport.\"\n\nMy mother went to the pharmacy and bought the medicine. I took the first pill and slept for twelve hours.\n\nOn Thursday, my fever went down, and I felt much better. My cough was still there, but my throat did not hurt. By Saturday, I was almost well again.\n\nNow I know that health is the most important thing. This winter, I will wash my hands often, eat more fruit and sleep eight hours every night. I do not want to be ill again!",q:[

  {t:"Dorixona va dori-darmon",title:"A Visit to the Pharmacy",text:"Last Monday, Dilnoza woke up with a sore throat and a headache. She felt very tired, and she had a high temperature. “I think I have a cold,” she said to herself. She did not go to work. Instead, she went to the pharmacy near her house.\n\nThe pharmacist was a kind woman called Mrs. Karimova. “Good morning. How can I help you?” she asked.\n\n“I have a sore throat, a cough and a headache,” said Dilnoza. “Can you give me something?”\n\nMrs. Karimova looked at her and asked some questions. “How long have you been ill?”\n\n“Since Saturday,” Dilnoza answered.\n\n“Do you have any allergies to medicine?”\n\n“No, I don’t.”\n\n“Good. Take these tablets for the headache. Take one tablet after breakfast and one after dinner. This syrup is for your cough. You should drink warm tea with honey, too. If you don’t feel better in three days, you must see a doctor.”\n\nDilnoza paid for the medicine and thanked her. At home, she drank tea, took her tablets and slept for four hours. In the evening, she felt much better.\n\nOn Thursday, she went back to the pharmacy with a box of chocolates. “Thank you for your advice,” she said. “I am healthy again, and tomorrow I will go back to work.”\n\n“I’m happy to hear that,” said Mrs. Karimova. “Remember to wash your hands and keep warm!”",q:[

  {t:"Oshxona va pishirish",title:"How to Make Plov",text:"Hello, friends! Today I want to show you how to make plov, my family’s favourite dish. It is not difficult, but you need time and patience.\n\nFirst, get everything ready. You need one kilo of rice, one kilo of beef, one kilo of carrots, two big onions, a head of garlic, oil and salt. You also need a big pot called a kazan. Wash the rice and leave it in warm water for an hour.\n\nNext, heat the oil in the kazan. Cut the onions and fry them until they are golden. Then add the meat and fry it for ten minutes. Cut the carrots into long thin pieces and put them on the meat. Add salt and a little water and cook everything for thirty minutes on a low heat.\n\nAfter that, put the rice on top. Do not mix it! Pour hot water into the pot until it is two centimetres above the rice. When the water is gone, put the garlic in the middle, cover the pot and cook for twenty minutes.\n\nFinally, mix the plov gently and put it on a big plate. My mother always says, “Good plov needs a good cook and a good fire.” I made this dish for the first time when I was twelve. It was terrible! The rice was hard and the meat was burnt. But I didn’t give up, and now everybody loves my plov.\n\nTry it this weekend and tell me how it was!",q:[

    {q:"How much rice do you need?",o:["Half a kilo","One kilo","Two kilos","Three kilos"],a:1},

    {q:"How old was the writer when he or she first made plov?",o:["Ten","Eleven","Twelve","Fifteen"],a:2},
    {q:"What was wrong with the first plov?",o:["It was cold","It had no salt","It was too sweet","The rice was hard and the meat was burnt"],a:3},

  {t:"Restoran",title:"Dinner at the Restaurant",text:"Waiter: Good evening! Welcome to Silk Road Restaurant. Do you have a reservation?\nJasur: Yes, a table for four under the name Rahimov.\nWaiter: Of course. Please follow me. Here is your table by the window. Here are the menus.\nJasur: Thank you. Madina, what would you like?\nMadina: I’m not sure. I’m very hungry, but I don’t eat meat.\nWaiter: We have a very good vegetable soup and a mushroom pasta. Both are vegetarian.\nMadina: The pasta sounds nice. I’ll have that, please.\nJasur: I’d like the lamb kebab with rice. And my parents will have the fish.\nWaiter: Would you like something to drink?\nJasur: Two glasses of orange juice, one green tea and a bottle of water, please.\nWaiter: Certainly. I’ll bring your drinks in a minute.\nTwenty minutes later, the waiter comes back with the food.\nWaiter: Here is your food. Enjoy your meal!\nJasur: Excuse me, this is not my order. I asked for lamb, but this is chicken.\nWaiter: I’m so sorry, sir. I’ll change it right now.\nMadina: The pasta is delicious! Would you like to try some, Jasur?\nJasur: No, thank you. Oh, here is my lamb. It is perfect now! Can we have the bill, please?\nWaiter: Here you are. The total is 280,000 sums.\nJasur: Can I pay by card?\nWaiter: Yes, of course.\nJasur: Thank you. The food and the service were great. Here is a tip for you.\nWaiter: Thank you very much! Please come again.",q:[

  {t:"Moda va kiyim xaridi",title:"A Shopping Adventure",text:"Subject: My shopping day\n\nHi Nargiza,\n\nHow are you? I hope you are well. I want to tell you about my shopping trip yesterday, because it was a real adventure!\n\nYou know that my cousin’s wedding is next month, so I need something special to wear. I went to the new shopping centre with my sister Laylo. First, we visited a big clothes shop. I tried on a long red dress, but it was too big for me, and the colour was not right. Red isn’t my favourite colour, and I think blue looks better on me.\n\nThen we went to another shop. There I found a beautiful blue dress with short sleeves. It fitted perfectly! The price was 400,000 sums, which was a bit expensive, but there was a sale, and I got twenty percent off. I was so happy. I also bought a pair of black shoes and a small bag. Laylo bought a warm jacket and some jeans for the winter.\n\nAfter shopping, we were tired, so we had coffee and cake in a café. We were laughing about how many bags we had!\n\nIf you are free on Saturday, let’s go shopping together. I need a scarf, and you said you wanted new trainers. Maybe we will find something good!\n\nWrite soon,\nSevara",q:[

  {t:"Sport va sog‘lom turmush",title:"Aziz Changes His Life",text:"Aziz is thirty-five years old, and two years ago he was not a sporty person. He worked in an office all day, ate fast food and never did exercise. “I was always tired, and I had back pain,” he says. “One day my doctor told me, ‘Aziz, if you don’t change your lifestyle, you will have health problems.’”\n\nThat was the start of his new life. At first, Aziz began to walk for twenty minutes every morning. After a month, he started to run. It was very hard. “I could only run for two minutes!” he laughs. But he did not stop. He bought good running shoes and joined a small running club in his city.\n\nNow Aziz runs five kilometres every day, and he goes to the gym on Tuesdays and Thursdays. On Saturdays he plays football with his friends, and on Sundays he swims in the pool with his two children. He has lost fifteen kilograms, and he feels strong and happy.\n\nLast month, Aziz ran his first race, a ten-kilometre run in Tashkent. He finished in fifty-eight minutes. “I wasn’t the fastest runner, but I was very proud,” he says. “My children were waiting for me at the finish line, and they were shouting my name.”\n\nWhat is his advice for beginners? “Start slowly, and don’t stop,” he says. “Sport is not only for young people. It is for everybody. Next year I’m going to run a marathon, and I’m sure I can do it!”",q:[

  {t:"Ko‘ngil ochar va bo‘sh vaqt",title:"What Do You Do in Your Free Time?",text:"We asked four people in Samarkand the same question: What do you do in your free time?\n\nBobur, 17, student: “I love video games. I play for about two hours every evening after homework. At weekends I play online with my friends from school. My mum says it is too much, but I think it is good for my brain!”\n\nGulnora, 42, teacher: “I’m very busy during the week, so at the weekend I like to relax. I read books, and sometimes I go to the theatre with my husband. Last month we saw a wonderful play about Alisher Navoi. I also enjoy painting, but I am not very good at it yet.”\n\nRustam, 28, engineer: “I’m a big fan of the outdoors. Every Saturday I go hiking in the mountains with a group of friends. We take sandwiches and tea, and we take lots of photos. Last summer we went camping for three days. It was fantastic!”\n\nMalika, 65, grandmother: “I don’t have much free time, because I look after my grandchildren. But when they are at school, I like to watch my favourite TV programmes and talk to my neighbours. In the evening I do puzzles. They help me to keep my mind active.”\n\nAs you can see, people have different hobbies. Some like to stay at home, and others prefer to go out. The important thing is to find something you enjoy and to make time for it. What do you do in your free time?",q:[

  {t:"Kino va musiqa",title:"A Weekend of Films and Music",text:"My name is Timur, and I love films and music. Last weekend was perfect for both!\n\nOn Friday evening, I went to the cinema with my friend Sardor. We watched a new adventure film called The Lost City. The story is about a young woman who finds an old map and travels to a secret city in the jungle. The actors were excellent, and the music in the film was very exciting. The film is two hours long, but I wasn’t bored at all. We ate popcorn and drank cola. The tickets cost 50,000 sums each, which is a fair price for a big screen and good sound. I would give the film four stars out of five. Sardor didn’t like the ending, but I think it was clever.\n\nOn Saturday, I went to a concert in the park. A famous Uzbek singer was performing with her band. I have been a fan of hers for five years, but I had never seen her live before. She sang my favourite song, and everyone sang with her. The guitarist was amazing, too. There were about two thousand people, and the atmosphere was wonderful. I took a lot of videos with my phone, so I can listen to the songs again at home.\n\nNow I’m learning to play the guitar myself. My teacher says I will be able to play a simple song in two months. Who knows? Maybe one day I will be on a stage, and people will come to listen to my music!",q:[

  {t:"Yangiliklar va ommaviy axborot vositalari",title:"How Do We Get the News?",text:"In the past, people got their news from newspapers, radio and TV. Today, things are very different. Let’s look at one family in Tashkent to see how.\n\nMr. Yusupov, 70, is a retired teacher. Every morning he buys a newspaper and reads it with his tea. “I trust newspapers,” he says. “Journalists check the facts before they write their stories.” In the evening, he watches the news on television at nine o’clock.\n\nHis son Anvar, 40, works in a bank. He is always busy, so he reads the news on his phone. He uses an app that shows him the main stories of the day. “I read the headlines on the bus,” he says. “If a story interests me, I read it in full.”\n\nAnvar’s daughter Zarina, 16, doesn’t read newspapers or watch TV. She gets her news from social media and short videos. “It is quick and easy,” she says. “But sometimes the news isn’t true. Last week I saw a story about a famous singer that was completely false. My teacher says we should always check the source.”\n\nZarina is right. Today anybody can write something online, and fake news spreads very fast. Experts give some simple advice. First, look at who wrote the story. Second, read more than one website. Third, don’t share a story if you are not sure it is true.\n\nWhatever way you choose to get your news, remember: a good reader asks questions and thinks carefully.",q:[
    {q:"What was Mr. Yusupov’s job?",o:["Teacher","Journalist","Banker","Doctor"],a:0},
    {q:"When does Mr. Yusupov watch the news on TV?",o:["At seven in the morning","At nine in the evening","At noon","At six in the evening"],a:1},

  {t:"Tabiat va atrof-muhit",title:"Clean-Up Day at the Lake",text:"Last Sunday, our class went to Charvak Lake for a special Clean-Up Day. The lake is one of the most beautiful places near Tashkent, but in summer many visitors leave rubbish on the beach. Our teacher, Mr. Ergashev, wanted us to help nature.\n\nWe arrived at eight o’clock in the morning. The weather was sunny, and the mountains were green. Mr. Ergashev gave us gloves and big bags. “Put plastic in the blue bag and paper in the yellow bag,” he explained. “Glass goes in the green bag.”\n\nWe worked for four hours. It was shocking how much rubbish we found: plastic bottles, bags, cans and even an old tyre. In total, we collected forty bags! One boy, Otabek, found a wallet with some money inside. He took it to the police, and the owner was very happy.\n\nAfter the work, we had a picnic and talked about the environment. Mr. Ergashev told us that plastic can stay in nature for hundreds of years. Animals and fish can die if they eat it. “If we all use less plastic, the planet will be healthier,” he said.\n\nI have decided to change my habits. I already bring a cloth bag when I go shopping, and from now on I will use a metal bottle instead of plastic ones. I will also walk to school instead of asking my father to drive me. Small actions are important. If everybody does a little, together we can protect our beautiful nature.",q:[
    {q:"Where did the class go?",o:["To Charvak Lake","To a forest","To the mountains of Samarkand","To a river"],a:0},
    {q:"Who is the teacher?",o:["Mr. Otabek","Mr. Ergashev","Mr. Charvak","Mr. Karimov"],a:1},

  {t:"Yovvoyi hayvonlar",title:"Wild Animals of Central Asia",text:"Central Asia is home to many wonderful wild animals. Some of them are rare, and we must protect them. Here are three of the most interesting.\n\nThe snow leopard is called “the ghost of the mountains”. It lives high in the mountains of Kyrgyzstan, Tajikistan and Uzbekistan. Its thick grey fur keeps it warm in the snow, and its long tail helps it to keep balance on steep rocks. A snow leopard can jump up to fifteen metres! It hunts at night and in the early morning, and it eats wild goats and sheep. Because it is so shy, many people have never seen one. Today, there are only about four thousand snow leopards in the world.\n\nThe brown bear lives in forests. In summer, it eats berries, roots, fish and insects. It is very big, but it can run at fifty kilometres an hour. In winter, the bear sleeps in a cave for several months. Scientists call this hibernation. If you ever meet a bear in the forest, don’t run! Stay calm and walk away slowly.\n\nThe saiga antelope is a strange animal with a big, soft nose. This nose warms the cold air in winter and cleans the dust in summer. Saigas live in the dry steppes of Kazakhstan and Uzbekistan, and they travel in big groups. In the past, hunters nearly killed all of them, but thanks to protection programmes, their number has grown in recent years.\n\nWhy are these animals in danger? People cut down forests, build roads and hunt illegally. The good news is that many countries are creating national parks. If we respect nature and keep wild animals’ homes safe, our children will be able to see them too.",q:[
    {q:"What is the snow leopard called?",o:["The ghost of the mountains","The king of the forest","The lord of the steppe","The cat of the snow"],a:0},
    {q:"What does the snow leopard’s long tail help it do?",o:["Run faster","Keep its balance","Catch fish","Stay warm"],a:1},

  {t:"Ob-havo va iqlim",title:"Four Seasons in Uzbekistan",text:"Uzbekistan has a continental climate, which means the summers are hot and the winters are cold. I’m Kamola, and I live in Tashkent. Let me tell you about the weather here through the year.\n\nSpring is my favourite season. In March and April it is warm and green, and flowers appear everywhere. It often rains, so I always carry an umbrella. Sometimes the weather changes quickly: in the morning it is sunny, and in the afternoon it is cloudy and windy.\n\nSummer is very hot. In July the temperature can reach forty degrees, and it almost never rains. We drink a lot of water, eat watermelon and stay inside in the afternoon. My family often goes to the mountains, where it is cooler.\n\nAutumn is mild and sunny. The leaves turn yellow and red, and the markets are full of fruit. Many people say it is the best time to visit Uzbekistan. In November, however, the days become shorter and foggy mornings begin.\n\nWinter is cold, and the temperature is often below zero. It doesn’t snow every day, but when it does, the city looks like a fairy tale. Last January it snowed for three days, and the schools were closed. We built a big snowman in the yard!\n\nThe climate is changing around the world, and we can feel it here, too. Summers are becoming hotter, and there is less snow in the mountains than before. Scientists say that if we don’t reduce pollution, the weather will become even more extreme. I hope people will take action soon.",q:[
    {q:"What kind of climate does Uzbekistan have?",o:["Continental","Tropical","Cold all year","Rainy all year"],a:0},

  {t:"Ta’lim va universitet",title:"My First Year at University",text:"I can’t believe my first year at university is almost over! My name is Farhod, and I study computer science at the Technical University in Tashkent. Here is what I have learned this year.\n\nLast September I was very nervous. I had moved from a small town in the Fergana Valley, and I didn’t know anybody. Everything was new: the buildings, the teachers and even the way of studying. At school, our teachers told us exactly what to do. At university, you must organise your own time. We have lectures in the morning, seminars in the afternoon, and a lot of homework in the evening.\n\nThe first exams in January were difficult. I didn’t study enough, and I got a low mark in mathematics. I was upset, but my friend Jamshid said, “Don’t give up. Let’s study together in the library.” Since then, we meet there every day after classes. We help each other and make notes together. In the summer exams, I got the highest mark in programming!\n\nUniversity life isn’t only about studying. I have joined the English club, where we speak English every Thursday. I’m also in the university football team. I live in a dormitory with three other students, and we often cook dinner together on Fridays.\n\nMy advice for new students is simple. First, go to every lecture. Second, find good friends who want to learn. Third, don’t be afraid to ask questions. Teachers are happy to help you.\n\nAfter I graduate, I’d like to work for an international company and, maybe, study for a master’s degree abroad. It’s a big dream, but I am working hard, and I believe it is possible.",q:[
    {q:"What does Farhod study?",o:["Mathematics","Computer science","English","Medicine"],a:1},
    {q:"Where does Farhod come from?",o:["From Tashkent","From Bukhara","From a small town in the Fergana Valley","From Samarkand"],a:2},

  {t:"Gadjetlar va maishiy texnika",title:"Grandfather’s New Phone",text:"Last month, my grandfather Karim bought his first smartphone. He is seventy-two years old, and until then he used an old phone with big buttons. “I want to see my grandchildren on video,” he said. So my sister and I helped him in the shop.\n\nThe shop assistant showed us a phone with a large screen. “It’s easy to use, and the letters are big,” he explained. It cost two million sums, and Grandfather paid in cash. He was very proud.\n\nAt home, the problems began. First, he couldn’t turn the phone on. He pressed the wrong button for ten minutes. Then he didn’t know how to answer calls. When I rang him, he touched the screen, but nothing happened. “This phone is broken!” he shouted. “No, Grandpa,” I laughed, “you must move your finger like this.”\n\nAfter a week of practice, he improved. He learned to take photos, send messages and make video calls. His first photo was of his tea, and his second was of his shoes! Now he photographs everything: flowers, the cat, even the sky.\n\nBut a smartphone is not the only gadget in our house. Last week, my mother bought a robot vacuum cleaner, and Grandfather doesn’t trust it. “A machine can’t clean better than me,” he says. Yesterday, the robot cleaned the whole living room in twenty minutes while Grandfather watched it with a suspicious face. In the end, he said, “Well, it’s not bad.”\n\nToday he has a new habit. Every evening at seven o’clock he calls his sister in Bukhara, and they talk for an hour. He says the phone is the best gadget in the world, because it lets him see the people he loves. I think he is right.",q:[

  {t:"Kundalik muammolar",title:"A Terrible Wednesday",text:"Some days everything goes wrong. Last Wednesday was one of those days for me.\n\nI woke up at seven forty, which was forty minutes late, because my alarm clock didn’t ring. I jumped out of bed and ran to the bathroom. The shower was freezing, because the boiler was broken. Then I wanted to make tea, but there was no milk and no sugar. I decided to go without breakfast.\n\nI grabbed my bag and ran to the bus stop, but the bus was just leaving. I waved my hands, but the driver didn’t see me. The next bus came after twenty minutes, and it was very crowded. I had to stand all the way. When I finally arrived at the office, I realised that I had left my phone at home. Without it I felt lost.\n\nAt work, my computer didn’t start. I called the IT department, and a young man said, “Have you tried turning it off and on again?” I did, and it worked! I felt silly.\n\nAt lunch, I went to a café and ordered a sandwich. When I wanted to pay, I couldn’t find my wallet. It was in my other bag! Luckily, my colleague Nodira paid for me. “Don’t worry,” she said. “You can buy me coffee tomorrow.”\n\nIn the evening, it started to rain, and of course I had no umbrella. I came home wet and tired. My phone was on the table, with fifteen missed calls from my mother. I called her back and told her about my terrible day. She laughed and said, “Tomorrow will be better.”\n\nShe was right. My brother fixed the boiler that night. On Thursday, my alarm rang on time, the water was hot, and the sun was shining. Now I always check my alarm before I sleep, and I keep an umbrella in my bag.",q:[
    {q:"What time did the writer wake up?",o:["Seven forty","Seven","Eight","Six forty"],a:0},
    {q:"Why did the writer wake up late?",o:["There was no water","The alarm clock didn’t ring","The phone was broken","The bus was late"],a:1},

  {t:"Orzular, maqsadlar va rejalar",title:"A Letter to My Future Self",text:"Dear future me,\n\nI’m writing this letter on my twentieth birthday, and I want you to read it in five years. My name is Shahnoza, and today I would like to tell you about my dreams, my goals and my plans.\n\nFirst, my dream is to become a doctor. Since I was a child, I have wanted to help sick people. When I was eight, my grandmother was in hospital, and a young doctor took care of her with such kindness. I decided then that I wanted to be like her. At the moment, I’m in my second year at medical university. It is difficult, but I love it. After I graduate, I’m going to work in a hospital in a village, because there are not enough doctors there.\n\nSecond, I have some smaller goals for this year. I’m going to improve my English, because the best medical books are in English. I study for one hour every evening, and I will take an international exam in June. I also want to learn to swim. I’m afraid of deep water, but I’ll start lessons next month. If I practise twice a week, I think I’ll be a good swimmer by summer.\n\nThird, I would like to travel. I have never been abroad. If I save enough money, I’ll visit Turkey next summer. In the future, I hope to see Japan, because I’m interested in its culture and its food.\n\nOf course, plans can change. Maybe I will find a new dream on the way, and that is fine. But I believe one thing will never change: if you work hard and never give up, you can reach your goals.\n\nNow I’m waiting for your answer, future me. Are you a doctor yet? Have you been to Japan? I hope you are happy and healthy.\n\nWith love,\nShahnoza",q:[

  const st=totalStars(),neu=[];
  GIFTS.forEach((g,i)=>{if(st>=g[2]&&!S.gd[i]){S.gd[i]=today();neu.push(i)}});

}

function list(kind){
  const K=KIND[kind],D=K.data(),dn=dayNo();
  const tile=(n,a)=>{
    const lock=n>dn,r=S.res[kind+n];
    const top=a==="l"?`${n}-kun`:(r?`${starTxt(starsOf(r))} ${r.s}/${r.t}`:`${n}-test`);
    return `<button class="tile ${lock?"lock":""} ${a==="q"&&r?"done":""}" data-n="${n}" data-a="${a}"><b>${lock?"🔒 ":""}${top}</b><span>${esc(kind==="t"?D[n-1].title:D[n-1].t)}</span></button>`;
  };
  let a="",b="";
  for(let n=1;n<=30;n++){a+=tile(n,"l");b+=tile(n,"q")}
  go("list-"+kind,`<button class="back" id="bk">← Orqaga</button><h2>${K.name}</h2>
  <div class="meta">Har kuni bitta yangi mavzu ochiladi. Testdan 90%+ = ⭐⭐⭐, 70%+ = ⭐⭐, 50%+ = ⭐</div>
  <div class="sec">${kind==="v"?"LUG'AT":kind==="g"?"DARSLAR":"MATNLAR"} (30)</div><div class="grid2">${a}</div>
  <div class="sec">TESTLAR (30 ta · ${K.tn} savoldan)</div><div class="grid2">${b}</div>`);

    const n=+el.dataset.n;
    if(n>dn){toast(`Bu mavzu ${n}-kuni ochiladi 🔒`);return}
    el.dataset.a==="l"?learn(kind,n):startTest(kind,n);

}

function learn(kind,n){

    h+=`<div class="box">${d.rule.split("\n").map(x=>`<p>${esc(x)}</p>`).join("")}</div>
    <div class="sec">MISOLLAR</div><div class="box">${d.ex.map(e=>`<div class="ex"><b>${esc(e[0])}</b><span>${esc(e[1])}</span></div>`).join("")}</div>`;
  }else{
    h+=`<div class="meta">${esc(d.title)}</div><div class="box" style="margin-top:8px">${d.text.split(/\n+/).map(x=>`<p>${esc(x)}</p>`).join("")}</div>
    <button class="big alt" id="lis">🔊 Tinglash</button>`;

}

/* ---------- Savollar ---------- */
function shufOpts(q){const c=q.o[q.a],o=shuffle(q.o);return Object.assign({},q,{o,a:o.indexOf(c)})}
function vq(w,pool,i,toUz,extra){
  const side=toUz?1:0;
  const wrong=shuffle(pool.filter(x=>x[0]!==w[0]&&x[side]!==w[side])).slice(0,3).map(x=>x[side]);
  const o=shuffle([w[side],...wrong]);
  return Object.assign({q:w[toUz?0:1],h:toUz?"O'zbekchasini tanlang":"Inglizchasini tanlang",say:toUz?w[0]:null,o,a:o.indexOf(w[side]),w:w[0]},extra||{});
}
function mkVocab(n){const w=WORDS[n-1].w;return shuffle(w.map((p,i)=>vq(p,w,i,i%2===0)))}
function startTest(kind,n){
  const D=KIND[kind].data()[n-1],title=`${n}. ${kind==="t"?D.title:D.t}`;
  const mk=kind==="v"?()=>mkVocab(n):kind==="g"?()=>shuffle(D.q).map(shufOpts):()=>D.q.map(q=>q.o?shufOpts(q):q);
  quiz(mk,kind+n,()=>list(kind),title,{stars:true});
}
const norm=s=>String(s).toLowerCase().replace(/'/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim().replace(/^(the|a|an) /,"");

function logAns(q,ok,o){
  if(q.w&&o.rv!==false){
    const r=S.rv[q.w]||{n:0,due:0};
    if(ok){r.n=Math.min(4,r.n+1);r.due=rawDay()+[1,2,4,7,14][r.n]}else{r.n=0;r.due=rawDay()+1}
    S.rv[q.w]=r;
  }
  const id=(q.w?"w|":"q|")+q.q;
  if(o.errMode){if(ok)S.err=S.err.filter(e=>e.id!==id)}
  else if(!ok&&o.log!==false){
    if(!S.err.some(e=>e.id===id)){S.err.unshift({id,q:q.q,h:q.h||"",o:q.o||null,a:q.a,open:q.open||null,say:q.say||null,w:q.w||null});if(S.err.length>200)S.err.length=200}
  }
  save();
}

function quiz(mk,key,back,title,opt){
  opt=opt||{};
  const qs=mk();let i=0,score=0;
  const draw=()=>{
    if(!qs.length){go("res",`<div class="center"><h2>${esc(title)}</h2><p>Savollar yo'q.</p><button class="big" id="bk">Orqaga</button></div>`);$("bk").onclick=back;return}
    if(i>=qs.length){
      let extra="";
      if(opt.stars){
        const prev=S.res[key],before=starsOf(prev);
        if(!prev||score>prev.s)S.res[key]={s:score,t:qs.length};
        const now=starsOf(S.res[key]),cur=starsOf({s:score,t:qs.length});
        S.sec[today()]=S.sec[today()]||1;save();
        const neu=checkGifts();
        extra=`<div class="stars">${starTxt(cur)}</div><p class="meta">${now>before?`+${now-before} yulduz qo'shildi! Jami: ⭐ ${totalStars()}`:`Eng yaxshi natijangiz: ${starTxt(now)} · Jami: ⭐ ${totalStars()}`}</p>`;
        if(neu.length)extra+=`<div class="box" style="margin-top:10px">🎉 Yangi sovg'a: <b>${neu.map(n=>GIFTS[n][0]+" "+GIFTS[n][1]).join(", ")}</b><br><a href="#" id="gl">Sertifikatni ko'rish</a></div>`;
      }else{S.sec[today()]=S.sec[today()]||1;save()}
      const p=score/qs.length;
      go("res",`<div class="center"><h2>${esc(title)}</h2><div class="score">${score}/${qs.length}</div>${extra}
      <p>${p>=.8?"Ajoyib! 🎉":p>=.5?"Yaxshi, davom eting! 💪":"Yana mashq qiling, albatta chiqadi! 🌱"}</p>
      ${opt.after?opt.after(score,qs.length):""}
      <button class="big" id="ag">${opt.again||"Qayta topshirish"}</button><button class="big alt" id="bk">Orqaga</button></div>`);
      $("ag").onclick=()=>quiz(mk,key,back,title,opt);$("bk").onclick=back;
      if($("gl"))$("gl").onclick=e=>{e.preventDefault();achv()};
      return;
    }
    const q=qs[i];
    let h=`<button class="back" id="bk">← Orqaga</button><div class="meta">${esc(title)} · ${i+1}/${qs.length}</div>
    <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
    ${q.h?`<div class="meta center" style="margin-top:14px">${esc(q.h)}</div>`:(q.open?`<div class="meta center" style="margin-top:14px">Javobni yozing</div>`:"")}
    <div class="q">${esc(q.q)}</div>${q.say?`<div class="center"><button class="spk" id="sp" aria-label="Tinglash">🔊</button></div>`:""}`;
    if(q.o)h+=q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("");
    else h+=`<input class="in" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Javobingiz..."><div id="fb"></div><button class="big" id="ck">Tekshirish</button>`;
    go("quiz",h);
    $("bk").onclick=back;
    if(q.say){$("sp").onclick=()=>speak(q.say);if(opt.auto)setTimeout(()=>speak(q.say),250)}
    let done=false;
    if(q.o){
      app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        if(done)return;done=true;
        const ok=+b.dataset.k===q.a;
        if(ok){score++;b.classList.add("ok")}
        else{b.classList.add("no");app.querySelectorAll(".opt")[q.a].classList.add("ok")}
        logAns(q,ok,opt);
        setTimeout(()=>{i++;draw()},ok?700:1500);
      });
    }else{
      const inp=$("in"),ck=$("ck");
      const check=()=>{
        if(done){i++;draw();return}
        const v=inp.value;if(!norm(v)){inp.focus();return}
        done=true;inp.disabled=true;
        const ok=q.open.some(x=>norm(x)===norm(v));
        if(ok)score++;
        logAns(q,ok,opt);
        $("fb").innerHTML=ok?`<div class="fb ok">✅ To'g'ri!</div>`:`<div class="fb no">❌ To'g'ri javob: <b>${esc(q.open[0])}</b></div>`;
        ck.textContent=i+1>=qs.length?"Natijani ko'rish":"Keyingisi";
      };
      ck.onclick=check;
      inp.onkeydown=e=>{if(e.key==="Enter")check()};
      inp.focus();
    }
  };
  draw();
}

/* ---------- Takrorlash ---------- */
function reviewPool(){
  let pool=P1.slice();
  for(let n=0;n<dayNo();n++)pool=pool.concat(WORDS[n].w.map(w=>[w[0],w[1]]));
  return pool;
}
function review(){
  const pool=reviewPool(),rd=rawDay();
  const due=pool.filter(w=>{const r=S.rv[w[0]];return r&&r.due<=rd});
  const fresh=pool.filter(w=>!S.rv[w[0]]);
  const nDue=due.length;
  go("rev",`<button class="back" id="bk">← Orqaga</button><h2>🔁 Takrorlash</h2>
  <div class="box"><p>Bu yerda <b>1-qism</b> va 2-qismda ochilgan so'zlar takrorlanadi. Xato qilgan so'zlar tezroq qaytadi, to'g'ri bilganlari esa kamroq so'raladi.</p>
  <p>Takrorlashga tayyor so'zlar: <b>${nDue}</b><br>Hali ko'rilmagan so'zlar: <b>${fresh.length}</b></p></div>
  <button class="big" id="go">▶️ 15 ta savol</button>`);
  $("bk").onclick=menu;
  $("go").onclick=()=>quiz(()=>{
    const pick=shuffle(due).slice(0,15);
    if(pick.length<15)pick.push(...shuffle(fresh).slice(0,15-pick.length));
    if(pick.length<15)pick.push(...shuffle(pool.filter(w=>!pick.includes(w))).slice(0,15-pick.length));
    return pick.map((w,i)=>vq(w,pool,i,Math.random()<.5,{}));
  },"rev",review,"Takrorlash",{log:true,again:"Yana 15 ta"});
}

  <div class="grid2">${TX.map((t,i)=>`<button class="tile ${i+1>dn?"lock":""}" data-n="${i+1}"><b>${i+1>dn?"🔒 ":""}${i+1}-matn</b><span>${esc(t.title)}</span></button>`).join("")}</div>`);

  $("l2").onclick=()=>quiz(()=>{const p=pool();return shuffle(p).slice(0,10).map(w=>{const wrong=shuffle(p.filter(x=>x!==w)).slice(0,3).map(x=>x[3]);const o=shuffle([w[3],...wrong]);return{q:"🔊 Eshiting",h:"Gapning tarjimasini tanlang",say:w[2],o,a:o.indexOf(w[3])}})},"l2",listen,"Gapni eshiting",{auto:true,log:false,rv:false,again:"Yana 10 ta"});

function playText(n){
  const d=TX[n-1];let show=false;
  go("play",`<button class="back" id="bk">← Orqaga</button><h2>${n}. ${esc(d.title)}</h2>
  <div class="two"><button class="big" id="pl">▶️ Tinglash</button><button class="big alt" id="st">⏹ To'xtatish</button></div>

  <button class="big alt" id="sh">📖 Matnni ko'rsatish</button><div id="tx"></div>`);
  $("bk").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}listen()};

}
