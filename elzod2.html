  const adv=(s,t)=>{const p=s/t;return `<div class="box" style="margin-top:10px;text-align:left">${p>=.8?"Siz bu darajadan yuqorisiz! Kurs sizga takrorlash va yangi so'zlar uchun foydali bo'ladi. Tezroq o'ting — testlardan ⭐⭐⭐ olishga harakat qiling.":p>=.5?"Yaxshi daraja! 1-kundan boshlang. Mavzularni tez o'tib, testlarga e'tibor bering.":"Hammasi yaxshi — 1-kundan boshlang. Agar 1-qismni tugatmagan bo'lsangiz, avval o'sha qismni ham o'ting."}</div>`};
  go("place",`<button class="back" id="bk">← Orqaga</button><h2>🎯 Kirish testi</h2>
  <div class="box"><p>20 ta savol: grammatika va so'zlar. Test yulduz bermaydi — faqat darajangizni ko'rsatadi.</p>${S.placed?`<p>Oxirgi natija: <b>${S.placed.s}/${S.placed.t}</b></p>`:""}</div>
  <button class="big" id="go">▶️ Boshlash</button>`);
  $("bk").onclick=menu;
  $("go").onclick=()=>quiz(()=>{
    const out=[];
    for(let k=0;k<15;k++){const g=GR[k*2];out.push(shufOpts(g.q[Math.random()*g.q.length|0]))}
    const all=WORDS.flatMap(t=>t.w);
    [2,8,14,20,26].forEach(n=>{const t=WORDS[n].w;out.push(vq(t[Math.random()*t.length|0],all,0,true,{w:null}))});
    return out.map(q=>Object.assign(q,{w:null}));
  },"place",menu,"Kirish testi",{log:false,rv:false,again:"Qayta topshirish",after:(s,t)=>{S.placed={s,t};save();return adv(s,t)}});
}

/* ---------- Yutuqlar ---------- */
const fireDays=()=>{const st=toNum(S.start);let n=0;for(let i=0;i<Math.min(30,rawDay());i++)if((S.sec[dstr(st+i)]||0)>=1800)n++;return n};
const testsDone=()=>Object.keys(S.res).length;
function finalInfo(){
  const f=fireDays();
  const bands=[[27,30,75,75,"A'lo"],[20,26,64,74,"Juda yaxshi"],[16,19,51,63,"Yaxshi"],[12,15,39,50,"Qoniqarli"]];
  const b=bands.find(x=>f>=x[0]&&f<=x[1]);
  if(!b)return{f,ok:false};
  const ks=Object.keys(S.res);let avg=0;
  if(ks.length)avg=ks.reduce((a,k)=>a+S.res[k].s/S.res[k].t,0)/ks.length;
  const score=b[2]===b[3]?b[2]:Math.round(b[2]+(b[3]-b[2])*avg);
  return{f,ok:true,score,grade:b[4]};
}
function achv(){
  const st=totalStars(),fi=finalInfo(),rd=rawDay();
  const canFinal=rd>=30&&fi.ok;
  go("ach",`<button class="back" id="bk">← Orqaga</button><h2>🏆 Yutuqlar</h2>
  <div class="box center"><div class="score" style="margin:0">⭐ ${st}</div><div class="meta">jami 270 yulduzdan · ${testsDone()}/90 test</div>
  <div class="bar"><i style="width:${st/270*100}%"></i></div></div>
  <div class="sec">SOVG'ALAR (bosing — sertifikat chiqadi)</div>
  <div class="gifts">${GIFTS.map((g,i)=>`<button class="gift ${st>=g[2]?"on":"off"}" data-i="${i}">${g[0]}<small>⭐${g[2]}</small></button>`).join("")}</div>
  <div class="sec">KURS SERTIFIKATI</div>
  <div class="box">${canFinal?`<p>🎓 Tabriklaymiz! Siz kursni tamomladingiz.</p><p>Faol kunlar: <b>${fi.f}/30</b> · Ball: <b>${fi.score}</b> · Daraja: <b>${fi.grade}</b></p>`:rd<30?`<p>Kurs sertifikati 30-kuni ochiladi (hozir ${rd}-kun). Kamida 12 kun 🔥 bo'lishi kerak. Hozircha 🔥: <b>${fi.f}</b></p>`:`<p>Sertifikat uchun kamida 12 ta 🔥 kun kerak edi. Sizda: <b>${fi.f}</b>.</p>`}</div>
  ${canFinal?`<button class="big" id="fc">🎓 Kurs sertifikatini ko'rish</button>`:""}`);
  $("bk").onclick=menu;
  app.querySelectorAll(".gift").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,g=GIFTS[i];
    if(st<g[2]){toast(`${g[0]} ${g[1]} uchun yana ${g[2]-st} yulduz kerak`);return}
    giftCert(i);
  });
  if(canFinal)$("fc").onclick=finalCert;
}

/* ---------- Sertifikat ---------- */
function certNo(tag){let h=0;const s=S.name+tag;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return "№ TZ2-"+String(h%1000000).padStart(6,"0")}
const imgCache={};
function loadImg(src){return imgCache[src]||(imgCache[src]=new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src}))}
async function drawCert(mode,T){
  const img=await loadImg(TPL[mode]);
  const c=document.createElement("canvas");c.width=img.width;c.height=img.height;
  const x=c.getContext("2d");x.drawImage(img,0,0);
  const F='Helvetica,Arial,sans-serif',G='Georgia,"Times New Roman",serif';
  const put=(id,txt,o)=>{
    const r=CFG[mode][id];if(!r)return;
    let size=o.size,font;
    const setF=()=>{font=`${o.it?"italic ":""}${o.b?"700 ":""}${size}px ${o.g?G:F}`;x.font=font};
    setF();
    const maxW=o.maxW||r[2];
    while(x.measureText(txt).width>maxW&&size>14){size-=2;setF()}
    x.fillStyle=o.c;x.textBaseline="middle";
    let px;
    if(o.al==="l"){x.textAlign="left";px=r[0]}else{x.textAlign="center";px=r[0]+r[2]/2}
    x.fillText(txt,px,r[1]+r[3]/2+(o.dy||0));
  };
  if(mode==="light"){
    put("name",T.name,{size:96,it:1,g:1,c:"#0f2a4a",al:"c",maxW:1300});
    put("l1",T.l1,{size:32,b:1,c:"#174270",al:"c"});put("l2",T.l2,{size:32,c:"#324a63",al:"c"});
    [1,2,3].forEach(k=>{put("s"+k+"l",T["s"+k+"l"],{size:26,c:"#4b6178",al:"c"});put("s"+k+"v",T["s"+k+"v"],{size:60,b:1,c:k===2?"#29a9e1":"#174270",al:"c",maxW:400})});
    put("date",T.date,{size:30,b:1,c:"#174270",al:"c"});put("num",T.num,{size:20,c:"#6b7f93",al:"c"});
  }else{
    put("rn",T.rn,{size:112,b:1,c:"#fff",al:"c",maxW:200});put("rl",T.rl,{size:22,c:"#bfe3f6",al:"c",maxW:210});put("sum",T.sum,{size:28,c:"#dbeefa",al:"c",maxW:440});
    put("name",T.name,{size:92,it:1,g:1,c:"#7fd0f5",al:"l",maxW:924});
    put("l1",T.l1,{size:32,b:1,c:"#fff",al:"l"});put("l2",T.l2,{size:32,c:"#e3f1fb",al:"l"});
    put("date",T.date,{size:30,b:1,c:"#fff",al:"l"});put("num",T.num,{size:18,c:"#8fb5d1",al:"l"});
  }
  return c;
}
function certScreen(title,T,fname,back){
  go("cert",`<button class="back" id="bk">← Orqaga</button><h2>${title}</h2><div class="meta">Ikkita dizayn. Saqlash yoki Telegramga yuborish mumkin. Rasmni uzoq bosib ham saqlasa bo'ladi.</div><div id="cw" class="center" style="padding:30px 0">Tayyorlanmoqda…</div>`);
  $("bk").onclick=back;
  Promise.all([drawCert("light",T),drawCert("dark",T)]).then(cs=>{
    const names=["Och dizayn","Qoramtir dizayn"];
    $("cw").className="";$("cw").style.padding="0";
    $("cw").innerHTML=cs.map((c,i)=>`<div class="sec">${names[i].toUpperCase()}</div><img class="cert" src="${c.toDataURL("image/jpeg",.92)}" alt="${names[i]}"><div class="two"><button class="big" data-s="${i}">💾 Saqlash</button><button class="big alt" data-h="${i}">📤 Yuborish</button></div>`).join("");
    const blob=(c)=>new Promise(r=>c.toBlob(r,"image/png"));
    $("cw").querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{
      const i=+b.dataset.s,bl=await blob(cs[i]),u=URL.createObjectURL(bl),a=document.createElement("a");
      a.href=u;a.download=fname+(i?"-qoramtir":"-och")+".png";document.body.appendChild(a);a.click();a.remove();
      toast("Saqlanmasa — rasmni uzoq bosib 'Saqlash' ni tanlang");
    });
    $("cw").querySelectorAll("[data-h]").forEach(b=>b.onclick=async()=>{
      const i=+b.dataset.h,bl=await blob(cs[i]),f=new File([bl],fname+(i?"-qoramtir":"-och")+".png",{type:"image/png"});
      try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"ENGLISH TILZINA 2 sertifikati"});return}}catch(e){if(e&&e.name==="AbortError")return}
      toast("Yuborish ishlamadi — rasmni uzoq bosib saqlang");
    });
  }).catch(()=>{$("cw").textContent="Sertifikatni tayyorlab bo'lmadi"});
}
function finalCert(){
  const fi=finalInfo();if(!S.cdate){S.cdate=today();save()}
  const T={name:S.name,l1:"ENGLISH TILZINA 2",l2:"kursini muvaffaqiyatli tamomlagani uchun topshirildi",
    s1l:"Faol kunlar",s1v:fi.f+" / 30",s2l:"Faollik balli",s2v:String(fi.score),s3l:"Daraja",s3v:fi.grade,
    date:dmy(S.cdate),num:certNo("final"),rn:String(fi.score),rl:"FAOLLIK BALLI",sum:`${fi.f} / 30 faol kun · Daraja: ${fi.grade}`};
  certScreen("🎓 Kurs sertifikati",T,"tilzina2-sertifikat",achv);
}
function giftCert(i){
  const g=GIFTS[i],st=totalStars();
  const T={name:S.name,l1:`ENGLISH TILZINA 2 · ${g[1]}`,l2:`kursida ${g[2]} ta yulduz to'plagani uchun sovg'a bilan taqdirlandi`,
    s1l:"Yulduzlar",s1v:st+" / 270",s2l:"Sovg'a",s2v:(i+1)+" / 10",s3l:"Yutuq",s3v:g[1],
    date:dmy(S.gd[i]||today()),num:certNo("g"+i),rn:String(st),rl:"YULDUZ",sum:`Sovg'a ${i+1}/10 · ${g[1]}`};
  certScreen(`${g[0]} ${g[1]} sertifikati`,T,"tilzina2-sovga-"+(i+1),achv);
}

/* ---------- Statistika ---------- */
function stats(){
  const ks=Object.keys(S.res),tot=Object.values(S.sec).reduce((a,b)=>a+b,0);
  const avg=ks.length?Math.round(ks.reduce((a,k)=>a+S.res[k].s/S.res[k].t,0)/ks.length*100):0;
  const by=k=>{const a=ks.filter(x=>x[0]===k);return a.length?Math.round(a.reduce((s,x)=>s+S.res[x].s/S.res[x].t,0)/a.length*100)+"%":"—"};
  const cnt=k=>ks.filter(x=>x[0]===k).length;
  let streak=0;{const st=toNum(S.start);for(let n=toNum(today());n>=st;n--){if((S.sec[dstr(n)]||0)>0)streak++;else if(n!==toNum(today()))break}}
  const hrs=Math.floor(tot/3600),mn=Math.floor(tot%3600/60);
  go("stat",`<button class="back" id="bk">← Orqaga</button><h2>📊 Statistika</h2>
  <div class="box">
  <div class="row"><span>Kun</span><b>${dayNo()} / 30</b></div>
  <div class="row"><span>🔥 faol kunlar</span><b>${fireDays()}</b></div>
  <div class="row"><span>Ketma-ket kirgan kunlar</span><b>${streak}</b></div>
  <div class="row"><span>Jami vaqt</span><b>${hrs?hrs+" soat ":""}${mn} daq</b></div>
  <div class="row"><span>⭐ Yulduzlar</span><b>${totalStars()} / 270</b></div>
  <div class="row"><span>Topshirilgan testlar</span><b>${ks.length} / 90</b></div>
  <div class="row"><span>O'rtacha natija</span><b>${avg}%</b></div></div>
  <div class="sec">BO'LIMLAR BO'YICHA</div><div class="box">
  <div class="row"><span>📖 Lug'at (${cnt("v")}/30)</span><b>${by("v")}</b></div>
  <div class="row"><span>🧩 Grammatika (${cnt("g")}/30)</span><b>${by("g")}</b></div>
  <div class="row"><span>📰 Matnlar (${cnt("t")}/30)</span><b>${by("t")}</b></div></div>
  <div class="sec">SO'ZLAR</div><div class="box">
  <div class="row"><span>Takrorlangan so'zlar</span><b>${Object.keys(S.rv).length}</b></div>
  <div class="row"><span>Mustahkam (4+ marta)</span><b>${Object.values(S.rv).filter(r=>r.n>=3).length}</b></div>
  <div class="row"><span>📕 Xatolar daftarida</span><b>${S.err.length}</b></div></div>
  <button class="big alt" id="nm">✏️ Ismni o'zgartirish (${esc(S.name)})</button>`);
  $("bk").onclick=menu;$("nm").onclick=()=>askName(stats,true);
}

if(!S.name)askName(menu);
menu();
if("serviceWorker"in navigator)navigator.serviceWorker.register("elzod2-sw.js").catch(()=>{});
</script>
